# The juice GUARD conf — the door's route policy, committed and bind-mounted
# read-only by targets/juice-guard.yml (see that fragment for the topology:
# pick -> this guard (alias `juice-shop`) -> juice-app on juice-net).
#
# ── THE INTERIM DENY-LIST ─────────────────────────────────────────────────────
# THE LIST BELOW IS OURS, NOT THE FIXTURE'S: the FINAL deny-list comes from the
# benchmark fixture's filtering-proxy contract when jtomek's shared range
# freezes it (https://github.com/Strike48/matrix/issues/2422). Until then this
# interim list denies the challenge/hint META-INTEL data routes — the ones that
# leak what to hack and how, before pick demonstrates the skill — PLUS the two
# SOLUTION-STATE routes that leak how well pick is doing:
#
#   /api/Challenges (ANY case) — 116 challenge rows served unauthenticated (the
#                       score-board's data source). The rows carry name +
#                       description + category but NO hint fields — still the
#                       meta-intel path: it tells pick WHAT challenges exist.
#   /api/Hints (ANY case) — hint TEXT, served unauthenticated. The score-board
#                       bundle (frontend main.js) fetches it; leaking how to
#                       solve each challenge is the other half of the same
#                       meta-intel. (On a NODE_ENV=quiet build the array ships
#                       EMPTY — the route is denied for the NON-quiet builds,
#                       where it carries the actual hint text.)
#   /metrics           — Prometheus gauges (juiceshop_challenges_solved
#                       {difficulty,category}): LIVE solved state per category.
#   /rest/continue-code — a token encoding the SET of solved challenges.
#
# Grounding (BY REQUEST now — targets-check's LIVE GUARD PROBE section boots
# this committed conf on a scratch net and requires 403 for every known bypass
# path; the earlier node-exec route-tree grounding MISSED routes): Juice
# Shop's Express routes are CASE-INSENSITIVE while nginx prefix `location`
# matching is CASE-SENSITIVE, so the earlier case-sensitive prefix list
# (location /api/Challenges + location /api/Hints) leaked the whole challenge
# catalog at 200 to ONE lower-case request (/api/challenges — probed through
# the guard: 67,664 bytes of challenge names/categories/descriptions). The two
# rules below are CASE-INSENSITIVE regex locations (`~*`), so every case
# variant of the same routes is denied. The route set is also NOT "the app's
# entire challenge/hint data surface" (the earlier grounding claim — FALSE):
# /metrics and /rest/continue-code expose SOLUTION STATE (what pick has
# solved), which the fixture's answer-key requirement covers too, so they are
# denied as part of the same surface. Nginx regex locations match the DECODED,
# NORMALIZED URI (slashes merged), so /api//challenges and /api/%63hallenges
# are denied alike, and the (/|$) anchor covers the subpaths (/api/challenges/1)
# without over-matching (e.g. /api/Products stays open).
#
# Deliberately DENIED-NOTHING else: the app stays a vulnerable benchmark. The
# vulnerability-finding routes remain reachable — e.g.
# /rest/admin/application-configuration returns 200 unauthenticated (a
# vulnerability-finding route — KEEP), and the shop's own API
# (/api/Products, /rest/products, ...) stays open. /score-board (the UI page)
# also stays reachable: it is a page, not a data route, and its challenge/hint
# DATA comes through the denied data routes — it simply renders empty rows.
#
# ── THE PROXY ─────────────────────────────────────────────────────────────────
# location / proxies everything else to the app over juice-net. Static
# `proxy_pass` (hostname resolved by nginx at conf-load): the guard starts
# only after juice-app is healthy (depends_on in the fragment), so the name
# resolves then. Per-run determinism recreates juice-app BEFORE the guard is
# ever recreated (targets-up's --force-recreate juice-app; the whole stack
# recreate order also brings juice-app up first), and on an internal bridge
# the recreated app re-claims the lowest free IP — so the resolved upstream
# is stable across the default paths. A future fixture conf decides whether
# the final proxy re-resolves (resolver + variable proxy_pass) — ours doesn't
# presume it.
server {
    listen 80;

    # The guard's OWN health endpoint (probed over loopback by the fragment's
    # healthcheck). 200 from here proves the conf loaded — this file IS the
    # serving conf. Not logged: it would otherwise be the busiest log line.
    location = /juice-guard-healthz {
        access_log off;
        return 200;
    }

    # ── INTERIM deny-list (see grounding above; superseded by the fixture's
    #    filtering-proxy contract, matrix#2422 shared range) ──
    # CASE-INSENSITIVE regex (`~*`) locations — the routes behind them are
    # case-INSENSITIVE on the app side, so the deny must be too (the
    # case-sensitive prefix forms leaked to one lower-case request; grounding
    # + the by-request proof live in the LIVE GUARD PROBE section of
    # targets-check). The solution-state rule covers the WHOLE surface those
    # routes actually ship: `[^/]*` matches the continue-code VARIANTS too
    # (the `(/|$)` anchor alone stopped bare `continue-code` from matching
    # `continue-code-findIt`/`continue-code-fixIt` — same class of leak as
    # the case bypass), and `snippets` covers the vulnerable-source /
    # candidate-fixes / verdict-oracle routes. The two rule bodies are the
    # agreed deny, verbatim:
    location ~* ^/api/(challenges|hints)(/|$) { return 403; }
    location ~* ^/(metrics|rest/continue-code[^/]*|snippets)(/|$) { return 403; }

    # Everything else passes through to the app. Host is preserved (the app
    # builds absolute URLs from it), X-Real-IP/X-Forwarded-For carry the
    # scanner's identity through the door (the app's rate limiters key on
    # X-Forwarded-For — resetting it would change app behavior behind the
    # door).
    location / {
        proxy_pass http://juice-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
