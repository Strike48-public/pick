name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --features pentest-platform/desktop-pcap

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --locked --features pentest-platform/desktop-pcap -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # CI runners have no BlackArch sandbox backend (no bwrap/proot installed).
    # With the sandbox enabled, tests that run a real command fall through to
    # download_proot + rootfs extraction, which hangs a non-root runner (tar
    # cannot create the CA-cert symlinks) until the 6-hour job timeout. Disable
    # the sandbox for the whole run so command execution takes the host path —
    # the same reason the pentest-core integration tests call set_use_sandbox(false).
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: cargo compiles every test target, then stops RUNNING at
      # the first target with a failing test. Without this flag a single red
      # target hides every later crate's test *results* (they're compiled but not
      # run/reported), so you learn about failures one CI round at a time. With it,
      # the job reports ALL failures in one run; exit code is unchanged, so any
      # failure still fails the job.
      - run: cargo test --workspace --locked --no-fail-fast --features pentest-platform/desktop-pcap

  chart-xss-guard:
    name: Chart XSS Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Behavioral regression guard for the chart_processor.js ECharts option
      # sanitizer (#371). No JS toolchain otherwise exists here; this is a
      # dependency-free `node` self-test, so it needs no install step.
      - run: node crates/ui/src/assets/chart_processor.test.js

  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    # Same rationale as the Test job: no sandbox backend on the runner, so keep
    # command execution on the host path and out of download_proot/rootfs.
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package pentest-headless --package pentest-platform --package pentest-core --locked --features pentest-platform/desktop-pcap
      - run: cargo test --package pentest-platform --package pentest-core --lib --locked --features pentest-platform/desktop-pcap

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # Pinned instead of resolved from releases/latest at run time: that
          # extra API call was a failure point, and an unpinned tool version is
          # non-reproducible. Bump deliberately.
          GITLEAKS_VERSION=8.30.1
          # --retry with backoff + --retry-all-errors survives the transient
          # "curl: (56) Connection died" that flaked this step before. Download
          # to a file (not | tar) so a partial transfer fails the retry rather
          # than corrupting the extract.
          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --verbose

  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --manifest-path Cargo.toml --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./**/bom.json
          retention-days: 90

  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint chart/pick-connector
