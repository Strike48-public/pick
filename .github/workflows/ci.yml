name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` lets the Android artifact steps (gated on the `build-apk` label)
    # run when the label is added to an existing PR, not only on push.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      # shared-key ties check/clippy/test to ONE cache: they compile the same
      # workspace + features, so the first to run populates it and the others
      # restore instead of building the crate graph from scratch three times.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      - run: cargo check --workspace --locked --features pentest-platform/desktop-pcap

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      - run: cargo clippy --workspace --locked --features pentest-platform/desktop-pcap -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # CI runners have no BlackArch sandbox backend (no bwrap/proot installed).
    # With the sandbox enabled, tests that run a real command fall through to
    # download_proot + rootfs extraction, which hangs a non-root runner (tar
    # cannot create the CA-cert symlinks) until the 6-hour job timeout. Disable
    # the sandbox for the whole run so command execution takes the host path —
    # the same reason the pentest-core integration tests call set_use_sandbox(false).
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      # --no-fail-fast: cargo compiles every test target, then stops RUNNING at
      # the first target with a failing test. Without this flag a single red
      # target hides every later crate's test *results* (they're compiled but not
      # run/reported), so you learn about failures one CI round at a time. With it,
      # the job reports ALL failures in one run; exit code is unchanged, so any
      # failure still fails the job.
      - run: cargo test --workspace --locked --no-fail-fast --features pentest-platform/desktop-pcap

  chart-xss-guard:
    name: Chart XSS Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Behavioral regression guard for the chart_processor.js ECharts option
      # sanitizer (#371). No JS toolchain otherwise exists here; this is a
      # dependency-free `node` self-test, so it needs no install step.
      - run: node crates/ui/src/assets/chart_processor.test.js

  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    # Same rationale as the Test job: no sandbox backend on the runner, so keep
    # command execution on the host path and out of download_proot/rootfs.
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package pentest-headless --package pentest-platform --package pentest-core --locked --features pentest-platform/desktop-pcap
      - run: cargo test --package pentest-platform --package pentest-core --lib --locked --features pentest-platform/desktop-pcap,pentest-core/browser-auth

  # Type-check the iOS build of pentest-platform. Its cfg(target_os = "ios")
  # code (crates/platform/src/ios/*) is compiled by NO other CI job — the
  # Linux/macOS-host jobs all target the host — so a workspace-wide change can
  # break the iOS build invisibly (it did: a NetworkInterface field rename
  # compiled everywhere except ios/system.rs).
  #
  # CRITICAL: use the SAME features the mobile app uses for iOS
  # (`--no-default-features --features ios`). pentest-platform defaults to the
  # `desktop` feature, which pulls `keyring` -> `apple-native-keyring-store`,
  # and that crate hard-errors on iOS without its `protected` feature. The app
  # never hits this because apps/mobile depends on pentest-platform with
  # default-features = false, features = ["ios"]; the CI check must match.
  # (Verified on the macOS iOS build host: default features reproduce the
  # `protected` compile_error!; --no-default-features --features ios builds
  # clean for aarch64-apple-ios.)
  #
  # Scoped to pentest-platform: it holds the ios/ cfg code and is where this
  # regression class lands. A full mobile-app / .ipa build needs Xcode SDK
  # provisioning (rquickjs-sys/objc2 build scripts) and is left to the local
  # `dx build --platform ios` workflow, not this type-check gate.
  check-ios:
    name: Check (iOS)
    runs-on: macos-latest
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Check pentest-platform for iOS
        run: cargo check --package pentest-platform --no-default-features --features ios --locked --target aarch64-apple-ios

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # Pinned instead of resolved from releases/latest at run time: that
          # extra API call was a failure point, and an unpinned tool version is
          # non-reproducible. Bump deliberately.
          GITLEAKS_VERSION=8.30.1
          # --retry with backoff + --retry-all-errors survives the transient
          # "curl: (56) Connection died" that flaked this step before. Download
          # to a file (not | tar) so a partial transfer fails the retry rather
          # than corrupting the extract.
          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --verbose

  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --manifest-path Cargo.toml --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./**/bom.json
          retention-days: 90

  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint chart/pick-connector

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Standard Android CI toolchain (NOT nix). The job used to build through
      # the flake, but that dragged in magic-nix-cache, which the GitHub Actions
      # Cache THROTTLES (HTTP 418) under the heavy Nix traffic — the job failed
      # at `fetch-proot` on every run and retries kept hitting the throttle. The
      # build only needs the NDK, Java, `dx`, and the Rust android targets, all
      # available as plain actions here. Versions mirror flake.nix (NDK r28,
      # build-tools 35.0.1, dioxus-cli 0.7.9) so CI stays close to local
      # `just build-android`. `just` reads ANDROID_HOME/NDK via _android-ndk-bin
      # and `dx` via DX_PATH, both set below — no nix develop wrapper needed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK + build-tools (versions from flake.nix)
        run: |
          sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.1" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust toolchain + android targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
      # `just` was previously provided by the nix shell; install it directly.
      # (Plain `run:` — the org action allowlist forbids third-party actions like
      # taiki-e/install-action; only actions/*, android-actions/*, dtolnay/*, etc.
      # are permitted, so command-line installs are the portable choice.)
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Cache cargo downloads + the Android cross-compile target dir. Keyed on
      # Cargo.lock so the job doesn't re-download ~1165 crates; per-job target key
      # for incremental reuse across runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-
      # Cache Gradle's downloaded dependencies + wrapper across runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # Cache the compiled `dx` BINARY so we don't recompile dioxus-cli (a
      # multi-minute build) every run. `cargo install` drops it in ~/.cargo/bin,
      # which the cargo-registry cache above does NOT cover — cache it separately,
      # keyed on the pinned version so a bump busts it.
      #
      # dx MUST match the dioxus RUNTIME crates in Cargo.lock (dioxus-core /
      # -html / -hooks = 0.7.10), NOT the `dioxus` metacrate's 0.7.3 or the
      # flake's 0.7.9 — dx enforces an exact match and errored "dx and dioxus
      # versions are incompatible!" with 0.7.9 against 0.7.10 core. (The nix
      # flake's 0.7.9 build happens to be lenient; the crates.io CLI is not.)
      - uses: actions/cache@v4
        id: dx-cache
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-0.7.10
      # Install the Dioxus CLI (`dx`) only on a cache miss, then expose it to
      # `just` via DX_PATH.
      - name: Install dioxus-cli (dx)
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Expose dx on PATH
        run: echo "DX_PATH=$HOME/.cargo/bin/dx" >> "$GITHUB_ENV"
      # Fetch the Termux proot runtime (proot + libtalloc + busybox +
      # libandroid-shmem) into android-jniLibs/ BEFORE building. android-jniLibs/
      # is gitignored (fetched artifacts, not source), and _inject-android-lib
      # copies whatever is there into the APK. Without this the APK builds but
      # ships no proot binaries, so the interactive shell fails to spawn at
      # runtime ("proot binary not found"). Mirrors the local dev prerequisite.
      # (Pure curl/ar/tar — no nix needed.)
      - name: Fetch Android proot runtime
        run: just fetch-proot
      - name: Build debug APK
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: just build-android

      # Installable artifacts, gated on the `build-apk` PR label so we only pay
      # the extra build time when someone actually wants a test build. Adds:
      #   - the debug APK just built (arm64 + x86_64 — installs on devices AND
      #     the x86_64 emulator)
      #   - a release AAB (issue #279 deliverable, unsigned — no Play key yet)
      #   - a universal APK converted from that AAB (debug-signed by bundletool
      #     so it is installable for testing)
      # bundletool (for the universal APK) was provided by the nix shell; install
      # it here for the labeled release path (plain `run:` — third-party actions
      # are blocked by the org allowlist). A wrapper script named `bundletool` on
      # PATH invokes the jar, matching how the recipe calls `bundletool ...`.
      - name: Install bundletool
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        run: |
          BT_VERSION=1.17.2
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar" \
            -o "$HOME/.local/bin/bundletool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s/.local/bin/bundletool.jar" "$@"\n' "$HOME" \
            > "$HOME/.local/bin/bundletool"
          chmod +x "$HOME/.local/bin/bundletool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build release AAB + universal APK
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: |
          just bundle-android
          just bundle-android-universal-apk

      - name: Stage Android artifacts
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        run: |
          mkdir -p dist
          cp target/dx/pick/debug/android/app/app/build/outputs/apk/debug/app-debug.apk \
             dist/pick-android-debug.apk
          cp target/dx/pick/release/android/app/app/build/outputs/bundle/release/app-release.aab \
             dist/pick-android-release-unsigned.aab
          cp target/dx/pick/release/android/pick-android-universal.apk \
             dist/pick-android-universal.apk

      - name: Upload Android artifacts
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        uses: actions/upload-artifact@v4
        with:
          name: pick-android-${{ github.event.pull_request.number }}
          path: dist/pick-android-*
          if-no-files-found: error
