name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` lets the Android artifact steps (gated on the `build-apk` label)
    # run when the label is added to an existing PR, not only on push.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      # shared-key ties check/clippy/test to ONE cache: they compile the same
      # workspace + features, so the first to run populates it and the others
      # restore instead of building the crate graph from scratch three times.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      - run: cargo check --workspace --locked --features pentest-platform/desktop-pcap

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      - run: cargo clippy --workspace --locked --features pentest-platform/desktop-pcap -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # CI runners have no BlackArch sandbox backend (no bwrap/proot installed).
    # With the sandbox enabled, tests that run a real command fall through to
    # download_proot + rootfs extraction, which hangs a non-root runner (tar
    # cannot create the CA-cert symlinks) until the 6-hour job timeout. Disable
    # the sandbox for the whole run so command execution takes the host path —
    # the same reason the pentest-core integration tests call set_use_sandbox(false).
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-linux
      - run: cargo test --workspace --locked --features pentest-platform/desktop-pcap

  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    # Same rationale as the Test job: no sandbox backend on the runner, so keep
    # command execution on the host path and out of download_proot/rootfs.
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package pentest-headless --package pentest-platform --package pentest-core --locked --features pentest-platform/desktop-pcap
      - run: cargo test --package pentest-platform --package pentest-core --lib --locked --features pentest-platform/desktop-pcap

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh api` gives us a proper JSON parse via --jq so we don't have to
          # regex our way through GitHub's compact JSON, which used to catch
          # the whole `"tag_name":"v8.30.1","draft":...` blob and produce a
          # malformed download URL.
          GITLEAKS_VERSION=$(gh api repos/gitleaks/gitleaks/releases/latest --jq '.tag_name' | sed 's/^v//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --verbose

  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --manifest-path Cargo.toml --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./**/bom.json
          retention-days: 90

  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint chart/pick-connector

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Build through the nix flake so PR CI uses the exact same toolchain,
      # SDK/NDK, dx, build-tools and aapt2 as local `just build-android`.
      - uses: DeterminateSystems/nix-installer-action@main
      # Cache nix store paths (toolchain, Android SDK/NDK, dx, gradle) across runs
      # and between nix jobs, backed by the GitHub Actions cache. Turns the cold
      # multi-minute `nix develop` toolchain build into a near-instant restore.
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Cache cargo downloads + the Android cross-compile target dir. Shared
      # registry/git key with android-crux (same crate graph) so they don't each
      # re-download ~1165 crates; per-job target key for incremental reuse across
      # runs. `just build-android` runs cargo via nix but still uses ~/.cargo and
      # ./target, so a plain actions/cache is the robust choice here (Swatinem's
      # action expects rustc on PATH, which lives inside `nix develop`).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-
      # Cache Gradle's downloaded dependencies + wrapper across runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # Fetch the Termux proot runtime (proot + libtalloc + busybox +
      # libandroid-shmem) into android-jniLibs/ BEFORE building. android-jniLibs/
      # is gitignored (fetched artifacts, not source), and _inject-android-lib
      # copies whatever is there into the APK. Without this the APK builds but
      # ships no proot binaries, so the interactive shell fails to spawn at
      # runtime ("proot binary not found"). Mirrors the local dev prerequisite.
      - name: Fetch Android proot runtime
        run: nix develop --command just fetch-proot
      - name: Build debug APK
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-android

      # Installable artifacts, gated on the `build-apk` PR label so we only pay
      # the extra build time when someone actually wants a test build. Adds:
      #   - the debug APK just built (arm64 + x86_64 — installs on devices AND
      #     the x86_64 emulator)
      #   - a release AAB (issue #279 deliverable, unsigned — no Play key yet)
      #   - a universal APK converted from that AAB (debug-signed by bundletool
      #     so it is installable for testing)
      - name: Build release AAB + universal APK
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: |
          nix develop --command just bundle-android
          nix develop --command just bundle-android-universal-apk

      - name: Stage Android artifacts
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        run: |
          mkdir -p dist
          cp target/dx/pentest-mobile/debug/android/app/app/build/outputs/apk/debug/app-debug.apk \
             dist/pick-android-debug.apk
          cp target/dx/pentest-mobile/release/android/app/app/build/outputs/bundle/release/app-release.aab \
             dist/pick-android-release-unsigned.aab
          cp target/dx/pentest-mobile/release/android/pentest-connector-android-universal.apk \
             dist/pick-android-universal.apk

      - name: Upload Android artifacts
        if: contains(github.event.pull_request.labels.*.name, 'build-apk')
        uses: actions/upload-artifact@v4
        with:
          name: pick-android-${{ github.event.pull_request.number }}
          path: dist/pick-android-*
          if-no-files-found: error

  android-crux:
    name: Android Crux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same nix flake as the Android Build job: cross-compiles the crux-ffi .so,
      # refreshes it into jniLibs (patchelf SONAME), then assembles the APK.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Shares the cargo-android-* key with the Android Build job (same crate
      # graph) so the two Android jobs reuse one another's registry/git + target
      # cross-compile artifacts instead of each building the workspace cold.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build android-crux debug APK
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-android-crux

  ios-crux:
    name: iOS Crux Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # macOS runner ships Xcode; the nix flake's darwin devShell supplies the
      # fenix Rust toolchain (+ aarch64-apple-ios-sim std) and just, mirroring the
      # local Mac build host. build-ios-crux cross-compiles the crux-ffi static lib
      # the xcodeproj links, then xcodebuild against the committed scheme.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-ios-${{ runner.os }}-
      - name: Build ios-crux (simulator)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-ios-crux
