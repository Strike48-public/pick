name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --features pentest-platform/desktop-pcap

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --locked --features pentest-platform/desktop-pcap -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # CI runners have no BlackArch sandbox backend (no bwrap/proot installed).
    # With the sandbox enabled, tests that run a real command fall through to
    # download_proot + rootfs extraction, which hangs a non-root runner (tar
    # cannot create the CA-cert symlinks) until the 6-hour job timeout. Disable
    # the sandbox for the whole run so command execution takes the host path —
    # the same reason the pentest-core integration tests call set_use_sandbox(false).
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev protobuf-compiler libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --features pentest-platform/desktop-pcap

  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    # Same rationale as the Test job: no sandbox backend on the runner, so keep
    # command execution on the host path and out of download_proot/rootfs.
    env:
      DISABLE_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package pentest-headless --package pentest-platform --package pentest-core --locked --features pentest-platform/desktop-pcap
      - run: cargo test --package pentest-platform --package pentest-core --lib --locked --features pentest-platform/desktop-pcap

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for org-owned repos, but a key must be requested at
          # https://gitleaks.io and stored as the GITLEAKS_LICENSE secret.
          # Personal accounts do not need it; organizations do, or the action
          # fails. The action auto-loads the repo's .gitleaks.toml.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --manifest-path Cargo.toml --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./**/bom.json
          retention-days: 90

  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint chart/pick-connector
