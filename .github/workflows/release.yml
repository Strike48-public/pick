name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
      # Tag pushes always sign and notarize (scripts/macos-sign-notarize.sh
      # fails the release if the Apple secrets are missing). This input only
      # lets a manual dispatch produce an unsigned test build.
      macos_signing:
        description: 'Sign and notarize the macOS binaries (Strike48 Developer ID)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Baked into release builds via option_env!("PICK_SENTRY_DSN") for usage
  # telemetry (#278). Named PICK_SENTRY_DSN (not the SDK's magic SENTRY_DSN) so
  # it's distinct from StrikeHub's own DSN and never read implicitly at runtime.
  # Absent/empty in forks and PRs -> telemetry compiles to a no-op.
  PICK_SENTRY_DSN: ${{ secrets.PICK_SENTRY_DSN }}
  # The Sentry environment for released builds. Baked in via
  # option_env!("STRIKE48_SENTRY_ENV") (telemetry::environment). Explicit here
  # because the mobile release-ffi libs build with debug_assertions OFF and have
  # no runtime env, so without this they'd fall through to the profile default.
  # Set as a workflow-level env so every build job inherits it.
  STRIKE48_SENTRY_ENV: production

jobs:
  # ===========================================
  # Desktop Builds
  # ===========================================
  build-desktop-linux:
    name: Desktop (Linux)
    # ubuntu-22.04 (not ubuntu-latest): glibc is not bundled, so the runner's
    # glibc sets the distro floor. 24.04 (glibc 2.39) silently produced
    # artifacts that failed on Ubuntu 22.04/Debian 12 (QA: GLIBC_2.38 not
    # found); 22.04 floors them at glibc 2.35. The "Verify glibc/libstdc++
    # floor + shared-library self-containment" step below fails the build on
    # any drift (strikehub#90 precedent).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # -dev packages are the build toolchain; the RUNTIME packages
          # provide the shared libraries the Package step bundles into the
          # tarball: libpcap0.8 libxcb1 libxdo3 libssl3 plus the transitive
          # closure of the bundled libraries (libdbus-1-3 libsystemd0
          # liblzma5 libzstd1 liblz4-1 libgcrypt20 libgpg-error0 libcap2
          # libxau6 libxdmcp6 libbsd0 libmd0) — named explicitly so the
          # bundle step never silently depends on apt's transitive picks.
          # libwebkit2gtk-4.1-dev supplies the webkit2gtk runtime, which is
          # intentionally NOT bundled — see the launcher's header and
          # docs/INSTALLATION.md.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libpcap-dev libxdo-dev libpcap0.8 libxcb1 libxdo3 libssl3 libdbus-1-3 libsystemd0 liblzma5 libzstd1 liblz4-1 libgcrypt20 libgpg-error0 libcap2 libxau6 libxdmcp6 libbsd0 libmd0 libxtst6

      # Desktop release binaries ship easy-mode-first: bake PICK_EASY_MODE and the
      # studio PLG host at build time (via option_env!) so a distributed binary
      # with no runtime .env boots into easy mode and auto-connects to studio,
      # matching the Android build. Web and headless deliberately stay neutral
      # (compiled easy_mode=false, host resolved from the runtime env).
      #
      # RUSTFLAGS bakes the $ORIGIN/lib rpath into the binary AT LINK TIME as
      # a DT_RPATH (not RUNPATH): --disable-new-dtags forces the DT_RPATH tag
      # deterministically on any binutils version, and DT_RPATH — unlike
      # DT_RUNPATH — is used spec-mandatedly for transitive dependencies too
      # (e.g. the bundled libssl resolving the bundled libcrypto), so the
      # Package step's lib/ directory is found from wherever the tarball is
      # extracted. Release jobs only — dev builds don't ship a lib/.
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-desktop --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # The real binary ships as pentest-connector-bin; the tarball's
          # entry point is the pentest-connector launcher next to it. The
          # binary links WebKit2GTK as a NEEDED library, so on a host
          # without it the process dies in the dynamic loader before any
          # of Pick's code can print an error — the launcher probes for
          # that gap up front and prints the exact apt line instead.
          cp target/release/pentest-connector dist/pentest-connector-bin

          # Bundle every shared library the binary links other than the
          # WebKit2GTK stack — libpcap (scan tooling), libxcb + libxdo
          # (screenshot/menu backends), OpenSSL 3 (native TLS) — plus the
          # TRANSITIVE CLOSURE of each (libpcap NEEDs libdbus-1 →
          # libsystemd → lzma/zstd/lz4/gcrypt/gpg-error/cap; libxcb NEEDs
          # libXau/libXdmcp → libbsd/libmd). The closure is the point:
          # NixOS/minimal-container hosts have none of it, and the
          # Verify step's allowlist-strict check fails the release if any
          # resolution escapes lib/. Deliberately NOT bundled: the
          # WebKit2GTK stack (50MB+ with helper processes — the strikehub
          # AppImage is the vehicle that bundles webkit, strikehub#102)
          # and the X11 libraries behind it (libX11 et al. arrive with the
          # libwebkit2gtk-4.1-0 package closure; bundling a second copy
          # would load two libX11 instances in one process). Exception:
          # libXtst — NEEDED by libxdo but NOT in the webkit closure,
          # so it is bundled to keep the host line at exactly one package.
          # scripts/bundle-linux-libs.sh sources the runner's runtime
          # packages at the glibc floor (ubuntu-22.04), not -dev symlinks.
          scripts/bundle-linux-libs.sh dist/lib \
            libpcap0.8:libpcap.so.0.8 \
            libdbus-1-3:libdbus-1.so.3 \
            libsystemd0:libsystemd.so.0 \
            liblzma5:liblzma.so.5 \
            libzstd1:libzstd.so.1 \
            liblz4-1:liblz4.so.1 \
            libgcrypt20:libgcrypt.so.20 \
            libgpg-error0:libgpg-error.so.0 \
            libcap2:libcap.so.2 \
            libssl3:libssl.so.3 \
            libssl3:libcrypto.so.3 \
            libxcb1:libxcb.so.1 \
            libxau6:libXau.so.6 \
            libxdmcp6:libXdmcp.so.6 \
            libbsd0:libbsd.so.0 \
            libmd0:libmd.so.0 \
            libxtst6:libXtst.so.6 \
            libxdo3:libxdo.so.3
          install -m 0755 scripts/desktop-launcher.sh dist/pentest-connector

          # License attribution for the redistributed libraries
          # (BSD-3-clause, Apache-2.0/OpenSSL dual, MIT/X11 — the file has
          # the full per-library list with the source copyright texts).
          cp THIRD-PARTY-NOTICES.md dist/

          cd dist && tar -czvf pick-linux-x86_64.tar.gz pentest-connector pentest-connector-bin THIRD-PARTY-NOTICES.md lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/pick-linux-x86_64.tar.gz -C "$tmp"
          # Host-provided stack: everything `apt install libwebkit2gtk-4.1-0`
          # provides (the web engine + its GTK/X11 package closure) is the
          # one documented host line (README + docs/INSTALLATION.md). The
          # soname list is computed from the runner's package metadata so
          # it tracks the closure instead of being a hardcoded list that
          # rots when the stack updates.
          allow="$(mktemp)"
          # Root package first: apt-cache depends lists only the DEPS of
          # the named package, so the webkit library files themselves
          # (shipped by libwebkit2gtk-4.1-0) would be missed otherwise.
          { echo "libwebkit2gtk-4.1-0"; apt-cache depends --recurse --no-recommends --no-suggests \
              --no-conflicts --no-breaks --no-replaces --no-enhances libwebkit2gtk-4.1-0 \
            | sed -n 's/^[[:space:]]*Depends:[[:space:]]*//p'; } \
            | sed -E 's/ \(.*$//' \
            | sort -u \
            | while IFS= read -r p; do
                  if dpkg -s "$p" >/dev/null 2>&1; then dpkg -L "$p" 2>/dev/null; fi
                done \
            | grep -E '/[^/]+\.so(\.[0-9]+)*$' \
            | xargs -r -n 1 basename | sort -u > "$allow"
          [ -s "$allow" ] || { echo "webkit closure allowlist came back empty" >&2; exit 1; }
          scripts/check-linux-deps.sh "$tmp" \
            --allow-missing-file "$allow" \
            --expect-file pentest-connector --expect-file pentest-connector-bin \
            --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp" "$allow"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: dist/pick-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Easy-mode-first desktop build (see the Linux desktop job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
        run: cargo build --locked --package pentest-desktop --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe does not need the VC++ Redistributable
        shell: pwsh
        run: ./scripts/check-windows-crt.ps1 target/release/pentest-connector.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-connector.exe dist/
          Compress-Archive -Path dist/pentest-connector.exe -DestinationPath dist/pick-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: dist/pick-windows-x86_64.zip

  build-desktop-macos:
    name: Desktop (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      # Easy-mode-first desktop build (see the Linux desktop job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
        run: cargo build --locked --package pentest-desktop --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      # On a tag push `inputs` is empty, so the event check is what makes every
      # tagged release signed; the input only opts a manual dispatch out.
      - name: Sign and notarize macOS binary
        if: github.event_name == 'push' || inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/macos-sign-notarize.sh target/${{ matrix.target }}/release/pentest-connector

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-connector dist/
          cd dist && tar -czvf pick-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}.tar.gz pentest-connector

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pick-macos-*.tar.gz

  # ===========================================
  # Web Build
  # ===========================================
  build-web:
    name: Web (Liveview)
    # ubuntu-22.04 keeps the glibc floor at 2.35 for Ubuntu 22.04/Debian 12
    # (same rationale as build-desktop-linux); enforced by the guard step below.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpcap0.8 / libssl3 / libxcb1 are the RUNTIME packages providing
          # the shared libraries the Package step bundles so the web binary is
          # self-contained (it links the same host libs as the agent), plus
          # the transitive closure of the bundled libraries (libdbus-1-3
          # libsystemd0 liblzma5 libzstd1 liblz4-1 libgcrypt20 libgpg-error0
          # libcap2 libxau6 libxdmcp6 libbsd0 libmd0), named explicitly so
          # the bundle step never depends on apt's transitive picks. The
          # -dev/webkit packages remain for the LiveView build toolchain.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev protobuf-compiler libpcap-dev libpcap0.8 libssl3 libxcb1 libdbus-1-3 libsystemd0 liblzma5 libzstd1 liblz4-1 libgcrypt20 libgpg-error0 libcap2 libxau6 libxdmcp6 libbsd0 libmd0

      - name: Build
        env:
          # Bake the $ORIGIN/lib rpath at link time as DT_RPATH (spec-mandated
          # for transitive deps too, unlike DT_RUNPATH) — see the desktop
          # job's Build step for the full rationale. Release jobs only.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-web --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pentest-web dist/

          # Bundle every shared library the web binary links — libpcap
          # (scan tooling), OpenSSL 3 (native TLS), libxcb (X11 screenshot
          # backend) — plus the TRANSITIVE CLOSURE of each (libpcap NEEDs
          # libdbus-1 → libsystemd → lzma/zstd/lz4/gcrypt/gpg-error/cap;
          # libxcb NEEDs libXau/libXdmcp → libbsd/libmd). The closure is
          # the difference between "resolves on the runner" and "resolves
          # on NixOS": stock Ubuntu happens to carry it, minimal hosts
          # don't. Nothing but the glibc/libgcc base system may come from
          # the host — the Verify step fails the release otherwise.
          scripts/bundle-linux-libs.sh dist/lib \
            libpcap0.8:libpcap.so.0.8 \
            libdbus-1-3:libdbus-1.so.3 \
            libsystemd0:libsystemd.so.0 \
            liblzma5:liblzma.so.5 \
            libzstd1:libzstd.so.1 \
            liblz4-1:liblz4.so.1 \
            libgcrypt20:libgcrypt.so.20 \
            libgpg-error0:libgpg-error.so.0 \
            libcap2:libcap.so.2 \
            libssl3:libssl.so.3 \
            libssl3:libcrypto.so.3 \
            libxcb1:libxcb.so.1 \
            libxau6:libXau.so.6 \
            libxdmcp6:libXdmcp.so.6 \
            libbsd0:libbsd.so.0 \
            libmd0:libmd.so.0

          # License attribution for the redistributed libraries
          # (see the file for the full per-library list).
          cp THIRD-PARTY-NOTICES.md dist/

          cd dist && tar -czvf ../pick-web.tar.gz pentest-web THIRD-PARTY-NOTICES.md lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf pick-web.tar.gz -C "$tmp"
          # The web binary must have NO host-provided shared libraries:
          # nothing is allowed-missing here.
          scripts/check-linux-deps.sh "$tmp" --expect-file pentest-web --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp"

      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: pick-web.tar.gz

  # ===========================================
  # Android Build
  # ===========================================
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build through the nix flake so CI uses the exact same toolchain, SDK/NDK,
      # dx CLI, build-tools and aapt2 as local `just build-android` — no drift.
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache-action: as in ci.yml's android job, the GitHub
      # Actions Cache throttles its Nix traffic (HTTP 418), so Nix substitutes
      # directly from cache.nixos.org instead (#499).
      # Cache cargo downloads + the Android release cross-compile target dir.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-release-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Fetch the Termux proot runtime (proot + libtalloc + busybox +
      # libandroid-shmem) into android-jniLibs/ before building. android-jniLibs/
      # is gitignored (fetched artifacts), and _inject-android-lib copies it into
      # the APK/AAB. Without this the build ships no proot binaries and the
      # interactive shell fails to spawn at runtime. Matches the CI android job.
      - name: Fetch Android proot runtime
        run: nix develop --command just fetch-proot

      # STRIKE48_HOST is baked at build time (mobile has no runtime env). Without
      # it the app has no backend URL, so the OAuth sign-in browser never opens
      # (Url::parse of an empty base fails). Matches the CI android job.
      - name: Build APK (release, arm64)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-android-release

      # Stage the unsigned APK out of the Gradle build tree NOW. The next step's
      # `just bundle-android` runs `./gradlew clean bundleRelease` in the SAME
      # dx-generated project (target/dx/pick/release/android/app); the `clean`
      # deletes app/build/ — including this APK — and only rebuilds the AAB,
      # so the APK was gone by the time Package ran (issue #543).
      - name: Stage unsigned APK
        run: |
          mkdir -p dist
          cp target/dx/pick/release/android/app/app/build/outputs/apk/release/app-release-unsigned.apk \
             dist/pick-android-arm64.apk

      # AAB is the Play-distribution deliverable (issue #279). It is UNSIGNED —
      # release signing needs the Play upload key we do not have yet; wire that
      # in here once the key exists. The universal APK is converted from the AAB
      # and debug-signed by bundletool purely so the release bundle's output is
      # installable for testing.
      - name: Build AAB + universal APK (release)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: |
          nix develop --command just bundle-android
          nix develop --command just bundle-android-universal-apk

      - name: Package
        run: |
          mkdir -p dist
          cp target/dx/pick/release/android/app/app/build/outputs/bundle/release/app-release.aab \
             dist/pick-android-release-unsigned.aab
          cp target/dx/pick/release/android/pick-android-universal.apk \
             dist/pick-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/pick-android-arm64.apk
            dist/pick-android-release-unsigned.aab
            dist/pick-android-universal.apk

  # ===========================================
  # iOS Build (requires macOS + signing)
  # ===========================================
  build-ios:
    name: iOS
    # Disabled. The Strike48 Apple Developer account now exists, but iOS needs
    # its own distribution certificate and provisioning profile, which the
    # macOS Developer ID signing above does not provide. The build environment
    # exists (the flake's aarch64-darwin devShell + `just build-ios`), so
    # re-enable this (as a simulator/unsigned build first) once those are set up.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: curl -sSLf https://dioxus.dev/install.sh | sh

      - name: Build (Simulator)
        run: |
          export PATH="$HOME/.dx/bin:$PATH"
          dx build --platform ios --package pick --release || echo "iOS build requires signing"

      # Note: Real iOS builds require Apple Developer signing
      - name: Package (if built)
        run: |
          mkdir -p dist
          if [ -d "target/dx/pick/release/ios" ]; then
            cd target/dx/pick/release/ios
            zip -r ../../../../../dist/pick-ios.zip .
          else
            echo "iOS build artifacts not found (signing required)"
            touch dist/pick-ios-placeholder.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/pick-ios*

  # ===========================================
  # Headless (pentest-agent) Builds
  # ===========================================
  build-headless-linux:
    name: Headless (Linux x86_64)
    # ubuntu-22.04 keeps the glibc floor at 2.35 for Ubuntu 22.04/Debian 12
    # (same rationale as build-desktop-linux); enforced by the guard step below.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpcap0.8 / libssl3 are the RUNTIME packages providing the
          # shared libraries the Package step bundles into the tarball so
          # the agent has zero host library dependencies (field incident:
          # released agent died on a NixOS host with
          # `error while loading shared libraries: libpcap.so.0.8`), plus
          # the transitive closure of the bundled libraries (libdbus-1-3
          # libsystemd0 liblzma5 libzstd1 liblz4-1 libgcrypt20
          # libgpg-error0 libcap2 — libpcap NEEDs libdbus-1 → libsystemd →
          # lzma/zstd/lz4/gcrypt/gpg-error/cap), named explicitly so the
          # bundle step never depends on apt's transitive picks.
          sudo apt-get install -y protobuf-compiler libpcap-dev libpcap0.8 libssl3 libdbus-1-3 libsystemd0 liblzma5 libzstd1 liblz4-1 libgcrypt20 libgpg-error0 libcap2

      # Easy-mode-first: bake PICK_EASY_MODE so the served LiveView UI defaults to
      # easy mode (resolve_easy_mode: persisted setting > build-time PICK_EASY_MODE
      # > app default). This is the agent StrikeHub embeds (registry asset
      # pentest-agent-{os}-{arch}), so the released StrikeHub connector matches a
      # local easy-mode build. No STRIKE48_HOST is baked: under StrikeHub the host
      # arrives over IPC, and standalone `pentest-agent connect <url>` supplies it.
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          # Bake the $ORIGIN/lib rpath at link time as DT_RPATH (spec-mandated
          # for transitive deps too, unlike DT_RUNPATH) — see the desktop
          # job's Build step for the full rationale. Release jobs only.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-headless --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pentest-agent dist/

          # Bundle every shared library the agent links — libpcap (the
          # desktop-pcap scan tooling) and OpenSSL 3 (libssl/libcrypto,
          # native TLS in the auth stack) — plus the TRANSITIVE CLOSURE of
          # each (libpcap NEEDs libdbus-1 → libsystemd → lzma/zstd/lz4/
          # gcrypt/gpg-error/cap). glibc + libgcc_s are the host base
          # system (the floor guard's premise) and are not bundled. The
          # binary stays at the tarball root — StrikeHub extracts it by
          # file name and execs that path directly, so no launcher is
          # possible here; the rpath is inert (harmless) when a consumer
          # extracts only the binary and fully self-contained when the
          # whole archive is extracted.
          scripts/bundle-linux-libs.sh dist/lib \
            libpcap0.8:libpcap.so.0.8 \
            libdbus-1-3:libdbus-1.so.3 \
            libsystemd0:libsystemd.so.0 \
            liblzma5:liblzma.so.5 \
            libzstd1:libzstd.so.1 \
            liblz4-1:liblz4.so.1 \
            libgcrypt20:libgcrypt.so.20 \
            libgpg-error0:libgpg-error.so.0 \
            libcap2:libcap.so.2 \
            libssl3:libssl.so.3 \
            libssl3:libcrypto.so.3

          # License attribution for the redistributed libraries
          # (see the file for the full per-library list).
          cp THIRD-PARTY-NOTICES.md dist/

          cd dist && tar -czvf pick-agent-linux-x86_64.tar.gz pentest-agent THIRD-PARTY-NOTICES.md lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/pick-agent-linux-x86_64.tar.gz -C "$tmp"
          # The agent must have NO host-provided shared libraries: nothing
          # is allowed-missing here.
          scripts/check-linux-deps.sh "$tmp" --expect-file pentest-agent --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp"

      - uses: actions/upload-artifact@v4
        with:
          name: headless-linux-x86_64
          path: dist/pick-agent-linux-x86_64.tar.gz

  build-headless-windows:
    name: Headless (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Easy-mode-first headless build (see the Linux headless job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
        run: cargo build --locked --package pentest-headless --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe does not need the VC++ Redistributable
        shell: pwsh
        run: ./scripts/check-windows-crt.ps1 target/release/pentest-agent.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-agent.exe dist/
          Compress-Archive -Path dist/pentest-agent.exe -DestinationPath dist/pick-agent-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: headless-windows-x86_64
          path: dist/pick-agent-windows-x86_64.zip

  build-headless-macos:
    name: Headless (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      # Easy-mode-first headless build (see the Linux headless job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
        run: cargo build --locked --package pentest-headless --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      # Same gate as the desktop macOS job: every tag push signs.
      - name: Sign and notarize macOS binary
        if: github.event_name == 'push' || inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/macos-sign-notarize.sh target/${{ matrix.target }}/release/pentest-agent

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-agent dist/
          cd dist && tar -czvf pick-agent-${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-aarch64' || 'darwin-x86_64' }}.tar.gz pentest-agent

      - uses: actions/upload-artifact@v4
        with:
          name: headless-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pick-agent-*.tar.gz

  # ===========================================
  # Create Release
  # ===========================================
  release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-web, build-headless-linux, build-headless-windows, build-headless-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation (actions/attest): mint the Sigstore OIDC
      # token, persist the attestation, and record the artifact metadata.
      id-token: write
      attestations: write
      artifact-metadata: write
    # Every action in this job is pinned to a commit SHA: the job can mint
    # attestations under this workflow's identity, so a moved tag must not be
    # able to change the code that runs here.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" -o -name "*.AppImage" \) -exec cp {} release/ \;

          # Backward-compatible headless-agent asset names. Deployed StrikeHub
          # versions fetch the agent as `pentest-agent-{os}-{arch}` (Pick's
          # original asset name); v0.1.9 renamed the archive to `pick-agent-*`,
          # which broke the connector download for already-installed clients
          # (a field client on StrikeHub 0.1.20 could only run by pinning an
          # older Pick). Publish BOTH names so already-deployed clients keep
          # working without a StrikeHub upgrade; new StrikeHub builds consume
          # `pick-agent-*` (see Strike48-public/strikehub#67). Aliases are copied
          # before checksums are generated, so SHA256SUMS.txt covers them too.
          # Remove once no supported StrikeHub fetches the old name.
          for f in release/pick-agent-*; do
            [ -e "$f" ] || continue
            alias_name="$(basename "$f" | sed 's/^pick-agent-/pentest-agent-/')"
            cp "$f" "release/${alias_name}"
          done

          ls -la release/

      # The version, from the dispatch input or the tag, flows into later
      # steps: sed in "Add Docker bundle" (where GNU sed's `e` command would
      # run shell), asset names and release notes, in a job that can mint
      # attestations. Passing it through env stops ${{ }} script injection in
      # this step only, so the value is also validated as semver here, before
      # any step can use it.
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            # The rejected value is not echoed: it is untrusted, and a newline in
            # it could smuggle a workflow command into the log.
            echo "::error::release version is not semver (MAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Add Docker bundle
        # The customer compose bundle (deploy/docker, docs/DOCKER_INSTALL.md)
        # ships as release assets so the guide can fetch it from the same tag
        # it pins the image to, instead of from an unpinned branch. The compose
        # file's default image tag is stamped to this release, so bundle and
        # image stay one consistent set without a manual bump before tagging.
        # Copied before checksums are generated, so SHA256SUMS.txt covers both.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/\${PICK_IMAGE_TAG:-[^}]*}/\${PICK_IMAGE_TAG:-${VERSION}}/" \
            deploy/docker/docker-compose.yml > release/pick-docker-compose.yml
          grep -qF "pick:\${PICK_IMAGE_TAG:-${VERSION}}" release/pick-docker-compose.yml
          cp deploy/docker/.env.example release/pick-docker.env.example
          install -m 0755 deploy/docker/preflight.sh release/pick-docker-preflight.sh
          # The agent runbook downloads this release's files, so pin it to this version too.
          sed "s/^PICK_VERSION=.*/PICK_VERSION=${VERSION}/" \
            deploy/docker/AGENT_SETUP.md > release/pick-docker-agent-setup.md
          grep -qx "PICK_VERSION=${VERSION}" release/pick-docker-agent-setup.md

      - name: Verify emitted AppImages do not require libfuse.so.2 (static FUSE-3 runtime)
        run: |
          set -euo pipefail
          # Pick's own Linux artifacts are tarballs, but pick's Linux payload
          # ships to end users inside the StrikeHub AppImage — which until
          # now carried the legacy AppImageKit runtime that dlopens
          # libfuse.so.2 at launch. Stock Ubuntu 24.04+ ships FUSE 3 only, so
          # the AppImage died at launch, silently from the app grid
          # (Strike48/project-management#377 finding 2, BLOCKER; #382). The
          # runtime swap (pinned static FUSE-3 type2-runtime) lands in the
          # strikehub pipeline; this guard enforces the same property here —
          # analogous to the ldd-based bundle guards (#553) — over every
          # AppImage this pipeline emits. Today pick emits none (the step
          # logs and passes); from the day an AppImage is emitted, a FUSE-2
          # runtime fails the release.
          shopt -s nullglob
          release="release"
          images=("$release"/*.AppImage)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "no AppImage artifacts in this release — nothing to verify"
          else
            for ai in "${images[@]}"; do
              scripts/check-appimage-fuse.sh "$ai"
            done
          fi

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SLSA build provenance for every asset in SHA256SUMS.txt. A checksum
      # published beside the asset only proves the download is intact; the
      # Sigstore-signed attestation proves it was built by this workflow from
      # this repo, and is checked with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # An unsigned manual test build must never become "latest".
          prerelease: ${{ github.event_name != 'push' && !inputs.macos_signing }}
          name: Pentest Connector v${{ steps.version.outputs.version }}
          files: |
            release/*
          body: |
            ## Pentest Connector v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pick-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pick-windows-x86_64.zip` |
            | macOS | x86_64 | `pick-macos-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pick-macos-aarch64.tar.gz` |
            | Web | WASM | `pick-web.tar.gz` |
            | Android | APK (arm64) | `pick-android-arm64.apk` |
            | Android | APK (universal) | `pick-android-universal.apk` |
            | Android | AAB (Play) | `pick-android-release-unsigned.aab` |

            #### Headless agent

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pick-agent-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pick-agent-windows-x86_64.zip` |
            | macOS | x86_64 | `pick-agent-darwin-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pick-agent-darwin-aarch64.tar.gz` |

            #### Linux runtime requirements

            The Linux tarballs are self-contained for their shared-library
            dependencies: every shared library a binary links other than
            the desktop's webkit stack — `libpcap`, OpenSSL 3
            (`libssl`/`libcrypto`), `libxcb` (agent, web and desktop),
            `libxdo` (desktop) and the **transitive closure of each**
            (the libdbus/libsystemd/lzma/zstd/lz4/gcrypt/gpg-error/cap
            stack behind `libpcap`, `libXau`/`libXdmcp`/`libbsd`/`libmd`
            behind `libxcb`, and `libXtst` — needed by `libxdo` but not
            carried by the webkit closure) — is bundled under `lib/`, resolved via an
            `$ORIGIN/lib` rpath baked into the binaries and verified at
            package time by `scripts/check-linux-deps.sh`, which fails the
            release if any resolution escapes `lib/` onto an undocumented
            host library. License attribution for the bundled libraries
            ships as `THIRD-PARTY-NOTICES.md` inside each Linux tarball.
            A host must provide only:

            - **glibc >= 2.35** (Ubuntu 22.04 / Debian 12+) plus the
              libgcc runtime — every binary.
            - **`libwebkit2gtk-4.1-0` and its package dependencies** —
              the desktop app only: `sudo apt install libwebkit2gtk-4.1-0`.
              That one package pulls the whole GTK/X11 web-engine closure
              (the web engine behind the UI plus libgtk-3, libX11 and
              friends — everything except `libXtst`, which is bundled), which is deliberately not bundled (50MB+ with its
              helper processes). Without it, the `pentest-connector`
              launcher prints that exact line instead of the binary dying
              in the dynamic loader before any of Pick's code can react.

            The headless agent (`pick-agent-linux-x86_64.tar.gz`) has no
            host library dependencies beyond the glibc/libgcc base system.

            Note on the bundled OpenSSL: the `$ORIGIN/lib` rpath makes the
            bundled `libcrypto`/`libssl` win over any host copy (rpath is
            searched before `LD_LIBRARY_PATH` and the default dirs), so
            OpenSSL security fixes reach users through Pick releases, not
            host package updates — rebuild/rotate on OpenSSL advisories.
            Legacy OpenSSL *provider* operations (e.g. legacy PKCS#12/RC4
            paths) dlopen from the host's compiled-in `ossl-modules`
            directory, so a host that needs them must ship the
            `libssl3`/`openssl` package alongside.

            On Windows, Pick runs its tools inside a Linux sandbox, so it needs
            WSL 2 (Pick imports its own distro on first use) or Docker. Without
            either, the Windows app connects to Studio but its scan tools
            cannot run.

            Each headless agent asset is also published under the legacy
            `pentest-agent-{os}-{arch}` name for backward compatibility with
            StrikeHub versions that fetch the original asset name.

            #### Docker bundle

            `pick-docker-compose.yml` and `pick-docker.env.example` are the
            customer compose bundle for this release; see
            `docs/DOCKER_INSTALL.md`. `pick-docker-preflight.sh` checks a host
            before install, and `pick-docker-agent-setup.md` is a runbook an
            AI coding agent can follow to do the install with you.

            ### Verifying a download

            The macOS binaries are ${{ (github.event_name == 'push' || inputs.macos_signing) && 'signed with the Strike48 Developer ID and notarized by Apple' || 'NOT signed (manual test build)' }}.

            Every asset except `SHA256SUMS.txt` carries a signed build provenance
            attestation. To confirm a file was built by this repository's release
            workflow from the ref this release was built from (`${{ github.ref }}`):

            ```
            gh attestation verify <file> --repo Strike48-public/pick \
              --signer-workflow Strike48-public/pick/.github/workflows/release.yml \
              --source-ref ${{ github.ref }}
            ```

            See `SHA256SUMS.txt` for file checksums.

