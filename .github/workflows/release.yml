name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
      # TEMPORARY: macOS signing disabled by default during Apple developer account suspension.
      # TODO: Change default back to true once account is restored.
      macos_signing:
        description: 'Enable macOS code signing & notarization (default: false due to account suspension)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Baked into release builds via option_env!("PICK_SENTRY_DSN") for usage
  # telemetry (#278). Named PICK_SENTRY_DSN (not the SDK's magic SENTRY_DSN) so
  # it's distinct from StrikeHub's own DSN and never read implicitly at runtime.
  # Absent/empty in forks and PRs -> telemetry compiles to a no-op.
  PICK_SENTRY_DSN: ${{ secrets.PICK_SENTRY_DSN }}
  # The Sentry environment for released builds. Baked in via
  # option_env!("STRIKE48_SENTRY_ENV") (telemetry::environment). Explicit here
  # because the mobile release-ffi libs build with debug_assertions OFF and have
  # no runtime env, so without this they'd fall through to the profile default.
  # Set as a workflow-level env so every build job inherits it.
  STRIKE48_SENTRY_ENV: production

jobs:
  # ===========================================
  # Desktop Builds
  # ===========================================
  build-desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libpcap-dev libxdo-dev

      - name: Build
        run: cargo build --locked --package pentest-desktop --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pentest-connector dist/
          cd dist && tar -czvf pentest-connector-linux-x86_64.tar.gz pentest-connector

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: dist/pentest-connector-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: cargo build --locked --package pentest-desktop --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-connector.exe dist/
          Compress-Archive -Path dist/pentest-connector.exe -DestinationPath dist/pentest-connector-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: dist/pentest-connector-windows-x86_64.zip

  build-desktop-macos:
    name: Desktop (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      - name: Build
        run: cargo build --locked --package pentest-desktop --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binary
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
            target/${{ matrix.target }}/release/pentest-connector

      - name: Notarize macOS binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/${{ matrix.target }}/release/pentest-connector $RUNNER_TEMP/pentest-connector.zip
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt..."
            if xcrun notarytool submit $RUNNER_TEMP/pentest-connector.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m; then
              echo "Notarization succeeded."
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Notarization failed, retrying in 30s..."
              sleep 30
            else
              echo "Notarization failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-connector dist/
          cd dist && tar -czvf pentest-connector-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}.tar.gz pentest-connector

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pentest-connector-macos-*.tar.gz

  # ===========================================
  # Web Build
  # ===========================================
  build-web:
    name: Web (Liveview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev protobuf-compiler libpcap-dev

      - name: Build
        run: cargo build --locked --package pentest-web --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pentest-web dist/
          cd dist && tar -czvf ../pentest-connector-web.tar.gz pentest-web

      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: pentest-connector-web.tar.gz

  # ===========================================
  # Android Build
  # ===========================================
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build through the nix flake so CI uses the exact same toolchain, SDK/NDK,
      # dx CLI, build-tools and aapt2 as local `just build-android` — no drift.
      - uses: DeterminateSystems/nix-installer-action@main
      # Cache the nix store (toolchain, Android SDK/NDK, dx) across release runs.
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Cache cargo downloads + the Android release cross-compile target dir.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-release-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Fetch the Termux proot runtime (proot + libtalloc + busybox +
      # libandroid-shmem) into android-jniLibs/ before building. android-jniLibs/
      # is gitignored (fetched artifacts), and _inject-android-lib copies it into
      # the APK/AAB. Without this the build ships no proot binaries and the
      # interactive shell fails to spawn at runtime. Matches the CI android job.
      - name: Fetch Android proot runtime
        run: nix develop --command just fetch-proot

      # STRIKE48_HOST is baked at build time (mobile has no runtime env). Without
      # it the app has no backend URL, so the OAuth sign-in browser never opens
      # (Url::parse of an empty base fails). Matches the CI android job.
      - name: Build APK (release, arm64)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-android-release

      # AAB is the Play-distribution deliverable (issue #279). It is UNSIGNED —
      # release signing needs the Play upload key we do not have yet; wire that
      # in here once the key exists. The universal APK is converted from the AAB
      # and debug-signed by bundletool purely so the release bundle's output is
      # installable for testing.
      - name: Build AAB + universal APK (release)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: |
          nix develop --command just bundle-android
          nix develop --command just bundle-android-universal-apk

      - name: Package
        run: |
          mkdir -p dist
          cp target/dx/pentest-mobile/release/android/app/app/build/outputs/apk/release/app-release-unsigned.apk \
             dist/pentest-connector-android-arm64.apk
          cp target/dx/pentest-mobile/release/android/app/app/build/outputs/bundle/release/app-release.aab \
             dist/pentest-connector-android-release-unsigned.aab
          cp target/dx/pentest-mobile/release/android/pentest-connector-android-universal.apk \
             dist/pentest-connector-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/pentest-connector-android-arm64.apk
            dist/pentest-connector-android-release-unsigned.aab
            dist/pentest-connector-android-universal.apk

  # ===========================================
  # iOS Build (requires macOS + signing)
  # ===========================================
  build-ios:
    name: iOS
    # Disabled: blocked on Apple Developer signing (account suspended, see the
    # macos_signing note above). The build environment now exists — the flake's
    # aarch64-darwin devShell + `just build-ios` — so re-enable this (as a
    # simulator/unsigned build first) once signing is available.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: curl -sSLf https://dioxus.dev/install.sh | sh

      - name: Build (Simulator)
        run: |
          export PATH="$HOME/.dx/bin:$PATH"
          dx build --platform ios --package pentest-mobile --release || echo "iOS build requires signing"

      # Note: Real iOS builds require Apple Developer signing
      - name: Package (if built)
        run: |
          mkdir -p dist
          if [ -d "target/dx/pentest-mobile/release/ios" ]; then
            cd target/dx/pentest-mobile/release/ios
            zip -r ../../../../../dist/pentest-connector-ios.zip .
          else
            echo "iOS build artifacts not found (signing required)"
            touch dist/pentest-connector-ios-placeholder.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/pentest-connector-ios*

  # ===========================================
  # Headless (pentest-agent) Builds
  # ===========================================
  build-headless-linux:
    name: Headless (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpcap-dev

      - name: Build
        run: cargo build --locked --package pentest-headless --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pentest-agent dist/
          cd dist && tar -czvf pentest-agent-linux-x86_64.tar.gz pentest-agent

      - uses: actions/upload-artifact@v4
        with:
          name: headless-linux-x86_64
          path: dist/pentest-agent-linux-x86_64.tar.gz

  build-headless-windows:
    name: Headless (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: cargo build --locked --package pentest-headless --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-agent.exe dist/
          Compress-Archive -Path dist/pentest-agent.exe -DestinationPath dist/pentest-agent-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: headless-windows-x86_64
          path: dist/pentest-agent-windows-x86_64.zip

  build-headless-macos:
    name: Headless (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      - name: Build
        run: cargo build --locked --package pentest-headless --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binary
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
            target/${{ matrix.target }}/release/pentest-agent

      - name: Notarize macOS binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/${{ matrix.target }}/release/pentest-agent $RUNNER_TEMP/pentest-agent.zip
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt..."
            if xcrun notarytool submit $RUNNER_TEMP/pentest-agent.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m; then
              echo "Notarization succeeded."
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Notarization failed, retrying in 30s..."
              sleep 30
            else
              echo "Notarization failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-agent dist/
          cd dist && tar -czvf pentest-agent-${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-aarch64' || 'darwin-x86_64' }}.tar.gz pentest-agent

      - uses: actions/upload-artifact@v4
        with:
          name: headless-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pentest-agent-*.tar.gz

  # ===========================================
  # Create Release
  # ===========================================
  release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-web, build-headless-linux, build-headless-windows, build-headless-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} release/ \;
          ls -la release/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pentest Connector v${{ steps.version.outputs.version }}
          files: |
            release/*
          body: |
            ## Pentest Connector v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pentest-connector-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pentest-connector-windows-x86_64.zip` |
            | macOS | x86_64 | `pentest-connector-macos-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pentest-connector-macos-aarch64.tar.gz` |
            | Web | WASM | `pentest-connector-web.tar.gz` |
            | Android | APK | `pentest-connector-android.apk` |

            #### Headless (pentest-agent)

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pentest-agent-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pentest-agent-windows-x86_64.zip` |
            | macOS | x86_64 | `pentest-agent-darwin-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pentest-agent-darwin-aarch64.tar.gz` |

            ### Checksums

            See `SHA256SUMS.txt` for file checksums.

