name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
      # TEMPORARY: macOS signing disabled by default during Apple developer account suspension.
      # TODO: Change default back to true once account is restored.
      macos_signing:
        description: 'Enable macOS code signing & notarization (default: false due to account suspension)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # Baked into release builds via option_env!("PICK_SENTRY_DSN") for usage
  # telemetry (#278). Named PICK_SENTRY_DSN (not the SDK's magic SENTRY_DSN) so
  # it's distinct from StrikeHub's own DSN and never read implicitly at runtime.
  # Absent/empty in forks and PRs -> telemetry compiles to a no-op.
  PICK_SENTRY_DSN: ${{ secrets.PICK_SENTRY_DSN }}
  # The Sentry environment for released builds. Baked in via
  # option_env!("STRIKE48_SENTRY_ENV") (telemetry::environment). Explicit here
  # because the mobile release-ffi libs build with debug_assertions OFF and have
  # no runtime env, so without this they'd fall through to the profile default.
  # Set as a workflow-level env so every build job inherits it.
  STRIKE48_SENTRY_ENV: production

jobs:
  # ===========================================
  # Desktop Builds
  # ===========================================
  build-desktop-linux:
    name: Desktop (Linux)
    # ubuntu-22.04 (not ubuntu-latest): glibc is not bundled, so the runner's
    # glibc sets the distro floor. 24.04 (glibc 2.39) silently produced
    # artifacts that failed on Ubuntu 22.04/Debian 12 (QA: GLIBC_2.38 not
    # found); 22.04 floors them at glibc 2.35. The "Verify glibc/libstdc++
    # floor + shared-library self-containment" step below fails the build on
    # any drift (strikehub#90 precedent).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpcap0.8 / libxcb1 / libxdo3 are the RUNTIME packages that
          # provide the three small shared libraries the Package step
          # bundles into the tarball (libwebkit2gtk-4.1-dev supplies the
          # webkit2gtk one, which is intentionally NOT bundled — see the
          # launcher's header and docs/INSTALLATION.md).
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libpcap-dev libxdo-dev libpcap0.8 libxcb1 libxdo3

      # Desktop release binaries ship easy-mode-first: bake PICK_EASY_MODE and the
      # studio PLG host at build time (via option_env!) so a distributed binary
      # with no runtime .env boots into easy mode and auto-connects to studio,
      # matching the Android build. Web and headless deliberately stay neutral
      # (compiled easy_mode=false, host resolved from the runtime env).
      #
      # RUSTFLAGS bakes the $ORIGIN/lib rpath into the binary AT LINK TIME as
      # a DT_RPATH (not RUNPATH): --disable-new-dtags forces the DT_RPATH tag
      # deterministically on any binutils version, and DT_RPATH — unlike
      # DT_RUNPATH — is used spec-mandatedly for transitive dependencies too
      # (e.g. the bundled libssl resolving the bundled libcrypto), so the
      # Package step's lib/ directory is found from wherever the tarball is
      # extracted. Release jobs only — dev builds don't ship a lib/.
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-desktop --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # The real binary ships as pentest-connector-bin; the tarball's
          # entry point is the pentest-connector launcher next to it. The
          # binary links WebKit2GTK as a NEEDED library, so on a host
          # without it the process dies in the dynamic loader before any
          # of Pick's code can print an error — the launcher probes for
          # that gap up front and prints the exact apt line instead.
          cp target/release/pentest-connector dist/pentest-connector-bin

          # Bundle the three small host libraries (libpcap for the scan
          # tooling, libxcb + libXdo for the screenshot backend) next to the
          # binary; the $ORIGIN/lib DT_RPATH baked in at link time (see the
          # Build step) resolves them, so the tarball is self-contained for
          # everything except WebKit2GTK (50MB+ with its helper processes;
          # bundling it is the helper-process rpath saga — the strikehub
          # AppImage is the vehicle that bundles webkit, strikehub#102).
          # Sourced from the runner's runtime packages at the glibc floor
          # (ubuntu-22.04), not the -dev symlinks.
          install -d dist/lib
          bundle_lib() {
              local f
              f=$(dpkg -L "$1" | grep -E "/$2$" | head -1 || true)
              [ -n "$f" ] && [ -f "$f" ] || { echo "bundled source library not found: $1 ($2)" >&2; exit 1; }
              cp "$f" dist/lib/
          }
          bundle_lib libpcap0.8 libpcap.so.0.8
          bundle_lib libxcb1 libxcb.so.1
          bundle_lib libxdo3 libXdo.so.3
          install -m 0755 scripts/desktop-launcher.sh dist/pentest-connector

          cd dist && tar -czvf pick-linux-x86_64.tar.gz pentest-connector pentest-connector-bin lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/pick-linux-x86_64.tar.gz -C "$tmp"
          # libwebkit2gtk-4.1.so.0 is the one allowed host-provided library
          # (documented in README + docs/INSTALLATION.md); everything else
          # must be bundled in lib/ or come from the glibc floor.
          scripts/check-linux-deps.sh "$tmp" --allow-missing libwebkit2gtk-4.1.so.0 --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: dist/pick-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Easy-mode-first desktop build (see the Linux desktop job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
        run: cargo build --locked --package pentest-desktop --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe does not need the VC++ Redistributable
        shell: pwsh
        run: ./scripts/check-windows-crt.ps1 target/release/pentest-connector.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-connector.exe dist/
          Compress-Archive -Path dist/pentest-connector.exe -DestinationPath dist/pick-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: dist/pick-windows-x86_64.zip

  build-desktop-macos:
    name: Desktop (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      # Easy-mode-first desktop build (see the Linux desktop job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          STRIKE48_HOST: https://studio.strike48.com
        run: cargo build --locked --package pentest-desktop --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binary
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
            target/${{ matrix.target }}/release/pentest-connector

      - name: Notarize macOS binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/${{ matrix.target }}/release/pentest-connector $RUNNER_TEMP/pentest-connector.zip
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt..."
            if xcrun notarytool submit $RUNNER_TEMP/pentest-connector.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m; then
              echo "Notarization succeeded."
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Notarization failed, retrying in 30s..."
              sleep 30
            else
              echo "Notarization failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-connector dist/
          cd dist && tar -czvf pick-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}.tar.gz pentest-connector

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pick-macos-*.tar.gz

  # ===========================================
  # Web Build
  # ===========================================
  build-web:
    name: Web (Liveview)
    # ubuntu-22.04 keeps the glibc floor at 2.35 for Ubuntu 22.04/Debian 12
    # (same rationale as build-desktop-linux); enforced by the guard step below.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpcap0.8 / libssl3 / libxcb1 are the RUNTIME packages providing
          # the shared libraries the Package step bundles so the web binary is
          # self-contained (it links the same host libs as the agent). The
          # -dev/webkit packages remain for the LiveView build toolchain.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev protobuf-compiler libpcap-dev libpcap0.8 libssl3 libxcb1

      - name: Build
        env:
          # Bake the $ORIGIN/lib rpath at link time as DT_RPATH (spec-mandated
          # for transitive deps too, unlike DT_RUNPATH) — see the desktop
          # job's Build step for the full rationale. Release jobs only.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-web --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pentest-web dist/

          # Bundle the host shared libraries the web binary links — libpcap
          # (scan tooling), OpenSSL 3 (native TLS), libxcb (X11 screenshot
          # backend) — next to the binary; the $ORIGIN/lib DT_RPATH baked in
          # at link time resolves them, so the tarball is self-contained.
          install -d dist/lib
          bundle_lib() {
              local f
              f=$(dpkg -L "$1" | grep -E "/$2$" | head -1 || true)
              [ -n "$f" ] && [ -f "$f" ] || { echo "bundled source library not found: $1 ($2)" >&2; exit 1; }
              cp "$f" dist/lib/
          }
          bundle_lib libpcap0.8 libpcap.so.0.8
          bundle_lib libssl3 libssl.so.3
          bundle_lib libssl3 libcrypto.so.3
          bundle_lib libxcb1 libxcb.so.1

          cd dist && tar -czvf ../pick-web.tar.gz pentest-web lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf pick-web.tar.gz -C "$tmp"
          # The web binary must have NO host-provided shared libraries:
          # nothing is allowed-missing here.
          scripts/check-linux-deps.sh "$tmp" --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp"

      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: pick-web.tar.gz

  # ===========================================
  # Android Build
  # ===========================================
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build through the nix flake so CI uses the exact same toolchain, SDK/NDK,
      # dx CLI, build-tools and aapt2 as local `just build-android` — no drift.
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache-action: as in ci.yml's android job, the GitHub
      # Actions Cache throttles its Nix traffic (HTTP 418), so Nix substitutes
      # directly from cache.nixos.org instead (#499).
      # Cache cargo downloads + the Android release cross-compile target dir.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-android-release-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android-lib/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Fetch the Termux proot runtime (proot + libtalloc + busybox +
      # libandroid-shmem) into android-jniLibs/ before building. android-jniLibs/
      # is gitignored (fetched artifacts), and _inject-android-lib copies it into
      # the APK/AAB. Without this the build ships no proot binaries and the
      # interactive shell fails to spawn at runtime. Matches the CI android job.
      - name: Fetch Android proot runtime
        run: nix develop --command just fetch-proot

      # STRIKE48_HOST is baked at build time (mobile has no runtime env). Without
      # it the app has no backend URL, so the OAuth sign-in browser never opens
      # (Url::parse of an empty base fails). Matches the CI android job.
      - name: Build APK (release, arm64)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: nix develop --command just build-android-release

      # Stage the unsigned APK out of the Gradle build tree NOW. The next step's
      # `just bundle-android` runs `./gradlew clean bundleRelease` in the SAME
      # dx-generated project (target/dx/pick/release/android/app); the `clean`
      # deletes app/build/ — including this APK — and only rebuilds the AAB,
      # so the APK was gone by the time Package ran (issue #543).
      - name: Stage unsigned APK
        run: |
          mkdir -p dist
          cp target/dx/pick/release/android/app/app/build/outputs/apk/release/app-release-unsigned.apk \
             dist/pick-android-arm64.apk

      # AAB is the Play-distribution deliverable (issue #279). It is UNSIGNED —
      # release signing needs the Play upload key we do not have yet; wire that
      # in here once the key exists. The universal APK is converted from the AAB
      # and debug-signed by bundletool purely so the release bundle's output is
      # installable for testing.
      - name: Build AAB + universal APK (release)
        env:
          STRIKE48_HOST: https://studio.strike48.com
        run: |
          nix develop --command just bundle-android
          nix develop --command just bundle-android-universal-apk

      - name: Package
        run: |
          mkdir -p dist
          cp target/dx/pick/release/android/app/app/build/outputs/bundle/release/app-release.aab \
             dist/pick-android-release-unsigned.aab
          cp target/dx/pick/release/android/pick-android-universal.apk \
             dist/pick-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/pick-android-arm64.apk
            dist/pick-android-release-unsigned.aab
            dist/pick-android-universal.apk

  # ===========================================
  # iOS Build (requires macOS + signing)
  # ===========================================
  build-ios:
    name: iOS
    # Disabled: blocked on Apple Developer signing (account suspended, see the
    # macos_signing note above). The build environment now exists — the flake's
    # aarch64-darwin devShell + `just build-ios` — so re-enable this (as a
    # simulator/unsigned build first) once signing is available.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: curl -sSLf https://dioxus.dev/install.sh | sh

      - name: Build (Simulator)
        run: |
          export PATH="$HOME/.dx/bin:$PATH"
          dx build --platform ios --package pick --release || echo "iOS build requires signing"

      # Note: Real iOS builds require Apple Developer signing
      - name: Package (if built)
        run: |
          mkdir -p dist
          if [ -d "target/dx/pick/release/ios" ]; then
            cd target/dx/pick/release/ios
            zip -r ../../../../../dist/pick-ios.zip .
          else
            echo "iOS build artifacts not found (signing required)"
            touch dist/pick-ios-placeholder.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/pick-ios*

  # ===========================================
  # Headless (pentest-agent) Builds
  # ===========================================
  build-headless-linux:
    name: Headless (Linux x86_64)
    # ubuntu-22.04 keeps the glibc floor at 2.35 for Ubuntu 22.04/Debian 12
    # (same rationale as build-desktop-linux); enforced by the guard step below.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpcap0.8 / libssl3 are the RUNTIME packages providing the
          # shared libraries the Package step bundles into the tarball so
          # the agent has zero host library dependencies (field incident:
          # released agent died on a NixOS host with
          # `error while loading shared libraries: libpcap.so.0.8`).
          sudo apt-get install -y protobuf-compiler libpcap-dev libpcap0.8 libssl3

      # Easy-mode-first: bake PICK_EASY_MODE so the served LiveView UI defaults to
      # easy mode (resolve_easy_mode: persisted setting > build-time PICK_EASY_MODE
      # > app default). This is the agent StrikeHub embeds (registry asset
      # pentest-agent-{os}-{arch}), so the released StrikeHub connector matches a
      # local easy-mode build. No STRIKE48_HOST is baked: under StrikeHub the host
      # arrives over IPC, and standalone `pentest-agent connect <url>` supplies it.
      - name: Build
        env:
          PICK_EASY_MODE: "true"
          # Bake the $ORIGIN/lib rpath at link time as DT_RPATH (spec-mandated
          # for transitive deps too, unlike DT_RUNPATH) — see the desktop
          # job's Build step for the full rationale. Release jobs only.
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
        run: cargo build --locked --package pentest-headless --release --features pentest-platform/desktop-pcap

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/pentest-agent dist/

          # Bundle the host shared libraries the agent links — libpcap
          # (the desktop-pcap scan tooling) and OpenSSL 3 (libssl/libcrypto,
          # native TLS in the auth stack) — next to the binary; the
          # $ORIGIN/lib DT_RPATH baked in at link time resolves them.
          # glibc + libgcc_s are the host base system (the floor guard's
          # premise) and are not bundled. The binary stays at the tarball
          # root — StrikeHub extracts it by file name and execs that path
          # directly, so no launcher is possible here; the rpath is inert
          # (harmless) when a consumer extracts only the binary and fully
          # self-contained when the whole archive is extracted.
          install -d dist/lib
          bundle_lib() {
              local f
              f=$(dpkg -L "$1" | grep -E "/$2$" | head -1 || true)
              [ -n "$f" ] && [ -f "$f" ] || { echo "bundled source library not found: $1 ($2)" >&2; exit 1; }
              cp "$f" dist/lib/
          }
          bundle_lib libpcap0.8 libpcap.so.0.8
          bundle_lib libssl3 libssl.so.3
          bundle_lib libssl3 libcrypto.so.3

          cd dist && tar -czvf pick-agent-linux-x86_64.tar.gz pentest-agent lib

      - name: Verify glibc/libstdc++ floor + shared-library self-containment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/pick-agent-linux-x86_64.tar.gz -C "$tmp"
          # The agent must have NO host-provided shared libraries: nothing
          # is allowed-missing here.
          scripts/check-linux-deps.sh "$tmp" --glibc 2.35 --glibcxx 3.4.30
          rm -rf "$tmp"

      - uses: actions/upload-artifact@v4
        with:
          name: headless-linux-x86_64
          path: dist/pick-agent-linux-x86_64.tar.gz

  build-headless-windows:
    name: Headless (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Easy-mode-first headless build (see the Linux headless job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
        run: cargo build --locked --package pentest-headless --release

      - name: Sign Windows binary
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe does not need the VC++ Redistributable
        shell: pwsh
        run: ./scripts/check-windows-crt.ps1 target/release/pentest-agent.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/pentest-agent.exe dist/
          Compress-Archive -Path dist/pentest-agent.exe -DestinationPath dist/pick-agent-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: headless-windows-x86_64
          path: dist/pick-agent-windows-x86_64.zip

  build-headless-macos:
    name: Headless (macOS ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf
        run: brew install protobuf

      # Easy-mode-first headless build (see the Linux headless job for rationale).
      - name: Build
        env:
          PICK_EASY_MODE: "true"
        run: cargo build --locked --package pentest-headless --release --target ${{ matrix.target }} --features pentest-platform/desktop-pcap

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binary
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
            target/${{ matrix.target }}/release/pentest-agent

      - name: Notarize macOS binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/${{ matrix.target }}/release/pentest-agent $RUNNER_TEMP/pentest-agent.zip
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt..."
            if xcrun notarytool submit $RUNNER_TEMP/pentest-agent.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m; then
              echo "Notarization succeeded."
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Notarization failed, retrying in 30s..."
              sleep 30
            else
              echo "Notarization failed after $attempt attempts."
              exit 1
            fi
          done

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pentest-agent dist/
          cd dist && tar -czvf pick-agent-${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-aarch64' || 'darwin-x86_64' }}.tar.gz pentest-agent

      - uses: actions/upload-artifact@v4
        with:
          name: headless-macos-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          path: dist/pick-agent-*.tar.gz

  # ===========================================
  # Create Release
  # ===========================================
  release:
    name: Create Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-web, build-headless-linux, build-headless-windows, build-headless-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} release/ \;

          # Backward-compatible headless-agent asset names. Deployed StrikeHub
          # versions fetch the agent as `pentest-agent-{os}-{arch}` (Pick's
          # original asset name); v0.1.9 renamed the archive to `pick-agent-*`,
          # which broke the connector download for already-installed clients
          # (a field client on StrikeHub 0.1.20 could only run by pinning an
          # older Pick). Publish BOTH names so already-deployed clients keep
          # working without a StrikeHub upgrade; new StrikeHub builds consume
          # `pick-agent-*` (see Strike48-public/strikehub#67). Aliases are copied
          # before checksums are generated, so SHA256SUMS.txt covers them too.
          # Remove once no supported StrikeHub fetches the old name.
          for f in release/pick-agent-*; do
            [ -e "$f" ] || continue
            alias_name="$(basename "$f" | sed 's/^pick-agent-/pentest-agent-/')"
            cp "$f" "release/${alias_name}"
          done

          ls -la release/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Add Docker bundle
        # The customer compose bundle (deploy/docker, docs/DOCKER_INSTALL.md)
        # ships as release assets so the guide can fetch it from the same tag
        # it pins the image to, instead of from an unpinned branch. The compose
        # file's default image tag is stamped to this release, so bundle and
        # image stay one consistent set without a manual bump before tagging.
        # Copied before checksums are generated, so SHA256SUMS.txt covers both.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/\${PICK_IMAGE_TAG:-[^}]*}/\${PICK_IMAGE_TAG:-${VERSION}}/" \
            deploy/docker/docker-compose.yml > release/pick-docker-compose.yml
          grep -qF "pick:\${PICK_IMAGE_TAG:-${VERSION}}" release/pick-docker-compose.yml
          cp deploy/docker/.env.example release/pick-docker.env.example
          install -m 0755 deploy/docker/preflight.sh release/pick-docker-preflight.sh
          # The agent runbook downloads this release's files, so pin it to this version too.
          sed "s/^PICK_VERSION=.*/PICK_VERSION=${VERSION}/" \
            deploy/docker/AGENT_SETUP.md > release/pick-docker-agent-setup.md
          grep -qx "PICK_VERSION=${VERSION}" release/pick-docker-agent-setup.md

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pentest Connector v${{ steps.version.outputs.version }}
          files: |
            release/*
          body: |
            ## Pentest Connector v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pick-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pick-windows-x86_64.zip` |
            | macOS | x86_64 | `pick-macos-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pick-macos-aarch64.tar.gz` |
            | Web | WASM | `pick-web.tar.gz` |
            | Android | APK (arm64) | `pick-android-arm64.apk` |
            | Android | APK (universal) | `pick-android-universal.apk` |
            | Android | AAB (Play) | `pick-android-release-unsigned.aab` |

            #### Headless agent

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `pick-agent-linux-x86_64.tar.gz` |
            | Windows | x86_64 | `pick-agent-windows-x86_64.zip` |
            | macOS | x86_64 | `pick-agent-darwin-x86_64.tar.gz` |
            | macOS | Apple Silicon | `pick-agent-darwin-aarch64.tar.gz` |

            #### Linux runtime requirements

            The Linux tarballs are self-contained for their small
            dependencies: every non-glibc shared library a binary links
            (`libpcap`, OpenSSL 3 `libssl`/`libcrypto`, `libxcb`, and
            `libXdo` in the desktop tarball) is bundled under `lib/`,
            resolved via an `$ORIGIN/lib` rpath baked into the binaries
            and verified by `scripts/check-linux-deps.sh` in the release
            pipeline. A host must provide only:

            - **glibc >= 2.35** (Ubuntu 22.04 / Debian 12+) — every binary.
            - **`libwebkit2gtk-4.1-0`** — the desktop app only:
              `sudo apt install libwebkit2gtk-4.1-0`. It is the web engine
              behind the UI and is deliberately not bundled (50MB+ with its
              helper processes). Without it, the `pentest-connector`
              launcher prints that exact line instead of the binary dying
              in the dynamic loader before any of Pick's code can react.

            The headless agent (`pick-agent-linux-x86_64.tar.gz`) has no
            host library dependencies beyond the glibc/libgcc base system.

            On Windows, Pick runs its tools inside a Linux sandbox, so it needs
            WSL 2 (Pick imports its own distro on first use) or Docker. Without
            either, the Windows app connects to Studio but its scan tools
            cannot run.

            Each headless agent asset is also published under the legacy
            `pentest-agent-{os}-{arch}` name for backward compatibility with
            StrikeHub versions that fetch the original asset name.

            #### Docker bundle

            `pick-docker-compose.yml` and `pick-docker.env.example` are the
            customer compose bundle for this release; see
            `docs/DOCKER_INSTALL.md`. `pick-docker-preflight.sh` checks a host
            before install, and `pick-docker-agent-setup.md` is a runbook an
            AI coding agent can follow to do the install with you.

            ### Checksums

            See `SHA256SUMS.txt` for file checksums.

