name: Multi-Arch Docker

on:
  push:
    branches: [main, feat/multi-arch-scratch-image]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger for (re)publishing the image of an already-released tag.
  #
  # Why this exists: GitHub suppresses workflow runs for events triggered by
  # GITHUB_TOKEN (token-recursion protection). Release tags are created by
  # softprops/action-gh-release using GITHUB_TOKEN, so the tag-push event for
  # such tags never fires and this workflow never runs for them. v0.1.12 and
  # v0.1.13 were released without their ghcr.io/strike48-public/pick images
  # ever being published (manifest 404), even though the
  # pick-docker-compose.yml shipped with each release pins them — the easy-mode
  # docker install was broken for both releases. Tags pushed by a human over
  # git/ssh DO fire the push event, which is why e.g. v0.1.11 got its image.
  #
  # To publish the image for an existing tag, dispatch this workflow with that
  # tag as the ref (UI: Actions -> Multi-Arch Docker -> Run workflow -> select
  # the tag; or `gh workflow run docker-multiarch.yml --repo
  # Strike48-public/pick --ref v0.1.13`). No inputs are needed: the run checks
  # out the dispatch ref (the tag's commit) and docker/metadata-action derives
  # the version tag from GITHUB_REF, so the image is built from the tag itself
  # and pushed as <version> (plus <major>.<minor> and the short-sha tag, as on
  # any tag push). See docs/DOCKER_INSTALL.md for the operator-facing notes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository may contain uppercase — Docker requires lowercase
  REGISTRY_IMAGE: ghcr.io/strike48-public/pick

jobs:
  # ---------------------------------------------------------------------------
  # Build per-architecture images natively (no QEMU)
  # ---------------------------------------------------------------------------
  build-image:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      meta_version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Build and push per-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY_IMAGE, matrix.arch) || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-arch images into a single multi-arch manifest
  # ---------------------------------------------------------------------------
  merge-manifests:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}"
          DIGEST_ARGS=""
          for f in *; do
            DIGEST_ARGS="$DIGEST_ARGS ${IMAGE}@sha256:${f}"
          done
          echo "Digests to merge: $DIGEST_ARGS"
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Tags to apply: $TAG_ARGS"
          docker buildx imagetools create $TAG_ARGS $DIGEST_ARGS

      - name: Inspect manifest
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting: $TAG"
          docker buildx imagetools inspect "$TAG"

      - name: Generate image report
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
