name: Multi-Arch Docker

on:
  push:
    branches: [main, feat/multi-arch-scratch-image]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger for (re)publishing the image of an already-released tag.
  #
  # Why this exists: GitHub suppresses workflow runs for events triggered by
  # GITHUB_TOKEN (token-recursion protection). Release tags are created by
  # softprops/action-gh-release using GITHUB_TOKEN, so the tag-push event for
  # such tags never fires and this workflow never runs for them. v0.1.12 and
  # v0.1.13 were released without their ghcr.io/strike48-public/pick images
  # ever being published (manifest 404), even though the
  # pick-docker-compose.yml shipped with each release pins them — the easy-mode
  # docker install was broken for both releases. Tags pushed by a human over
  # git/ssh DO fire the push event, which is why e.g. v0.1.11 got its image.
  #
  # How to (re)publish a release's image: dispatch THIS workflow on main (the
  # default branch) and pass the release tag as the `tag` input:
  #
  #   UI:  Actions -> Multi-Arch Docker -> Run workflow -> tag: v0.1.13
  #   CLI: gh workflow run docker-multiarch.yml --repo
  #        Strike48-public/pick -f tag=v0.1.13
  #
  # The run then checks that tag out explicitly (actions/checkout with
  # ref: ${{ inputs.tag }}) and pushes the image as <version> (0.1.13) plus
  # <major>.<minor> (0.1) plus the tag commit's short sha - as on any tag
  # push - and ONLY those tags: :latest and :main are explicitly gated to
  # push events so a backfill can never move them. See docs/DOCKER_INSTALL.md
  # for the operator-facing notes.
  #
  # Why not dispatch AT the tag ref? GitHub validates the workflow_dispatch
  # trigger against the tree of the ref being dispatched. Release tags such
  # as v0.1.13 predate this trigger (added by
  # https://github.com/Strike48-public/pick/pull/551), so their trees have no
  # workflow_dispatch block and dispatching them fails with HTTP 422 "Workflow
  # does not have 'workflow_dispatch' trigger". main has the trigger, so the
  # dispatch happens there and the tag travels as an input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v0.1.13'
        required: true
        type: string

concurrency:
  # Backfill dispatches all run at ref refs/heads/main, so the group must
  # include the tag input: without it, backfilling v0.1.12 and v0.1.13 would
  # cancel each other. Re-dispatching the same tag queues instead of racing.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  # Only PR-scoped runs cancel their own stale predecessors (their group is
  # PR-unique, so this only supersedes 'my older run for this PR'). main pushes
  # and workflow_dispatch backfills QUEUE instead of racing: GitHub reruns of
  # workflow_dispatch lose the `inputs` context, dropping a rerun into the bare
  # `${ref}` group where it was repeatedly cancelled by (and cancelled) ordinary
  # main-branch activity — killing the manifest-merge step after both arch
  # builds succeeded (both arch Builds green, Merge cancelled). Queueing
  # defuses that whole collision class; tag/PR/ref keying above is unchanged.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository may contain uppercase — Docker requires lowercase
  REGISTRY_IMAGE: ghcr.io/strike48-public/pick

jobs:
  # ---------------------------------------------------------------------------
  # Build per-architecture images natively (no QEMU)
  # ---------------------------------------------------------------------------
  build-image:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      meta_version: ${{ steps.meta.outputs.version }}
      # Short sha of the commit actually built. On workflow_dispatch this is
      # NOT GITHUB_SHA (which is main's head, the dispatch ref): the vers
      # step below runs after the tag checkout and reports the tag's commit.
      # merge-manifests uses it for the sha tag on the backfill path.
      dispatch_commit: ${{ steps.vers.outputs.commit }}

    steps:
      # workflow_dispatch backfills check out the release tag being
      # (re)published. On push/PR runs inputs.tag is empty and
      # actions/checkout falls back to the event's own commit (unchanged).
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # docker/metadata-action's type=semver only engages on tag refs
      # (GITHUB_REF=refs/tags/...); a backfill dispatch happens at
      # refs/heads/main, so derive the version tags from inputs.tag here and
      # apply them as type=raw lines (enabled for workflow_dispatch only) in
      # the metadata steps below. Runs after checkout, so HEAD is the tag's
      # commit.
      - name: Derive backfill version from dispatch input
        id: vers
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          case "${TAG}" in
            v[0-9]*.*) ;;
            *)
              echo "Invalid tag '${TAG}': expected a release tag like v0.1.13" >&2
              exit 1
              ;;
          esac
          # Strict charset guard (review SHOULD-FIX): the case glob admits ',' —
          # v0.1.13,latest passes it, and metadata-action's csv-parse would then
          # let a smuggled field overwrite value= (moving :latest from a backfill).
          [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "Invalid tag '${TAG}': comma-free vX.Y.Z required" >&2; exit 1; }
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          COMMIT="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "commit=${COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # workflow_dispatch backfill: version tags derived from
            # inputs.tag; never latest, never main.
            type=raw,value=${{ steps.vers.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.vers.outputs.major_minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.vers.outputs.commit }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # push/PR path (unchanged semantics).
            # ref,event=branch is gated to push: metadata-action matches any
            # refs/heads/ ref with no event check, so without the gate a
            # dispatch at main would also tag :main.
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # On dispatch GITHUB_SHA is main's head, not the tag's commit;
            # the backfill's sha tag is the raw line above instead.
            type=sha,prefix=,enable=${{ github.event_name != 'workflow_dispatch' }}
            # latest only on push to main. is_default_branch is NOT safe:
            # it is also true for a workflow_dispatch at main, which would
            # move :latest to whatever release is being backfilled.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push per-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY_IMAGE, matrix.arch) || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-arch images into a single multi-arch manifest
  # ---------------------------------------------------------------------------
  merge-manifests:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      # Same derivation as in build-image. This job never checks out source
      # (it only merges per-arch digests), so there is no git here: the short
      # sha of the built commit comes from build-image's dispatch_commit
      # output, where the tag was actually checked out.
      - name: Derive backfill version from dispatch input
        id: vers
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          case "${TAG}" in
            v[0-9]*.*) ;;
            *)
              echo "Invalid tag '${TAG}': expected a release tag like v0.1.13" >&2
              exit 1
              ;;
          esac
          # Strict charset guard (review SHOULD-FIX): the case glob admits ',' —
          # v0.1.13,latest passes it, and metadata-action's csv-parse would then
          # let a smuggled field overwrite value= (moving :latest from a backfill).
          [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "Invalid tag '${TAG}': comma-free vX.Y.Z required" >&2; exit 1; }
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # workflow_dispatch backfill: version tags derived from
            # inputs.tag; the sha tag is the tag's own commit (from
            # build-image, which checked it out), never latest, never main.
            # This job is where tags actually land: build-image pushes the
            # per-arch images by digest and this job applies the tags via
            # imagetools create.
            type=raw,value=${{ steps.vers.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.vers.outputs.major_minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.build-image.outputs.dispatch_commit }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,enable=${{ github.event_name != 'workflow_dispatch' }}
            # latest only on push to main (is_default_branch is also true
            # for a workflow_dispatch at main - see build-image).
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}"
          DIGEST_ARGS=""
          for f in *; do
            DIGEST_ARGS="$DIGEST_ARGS ${IMAGE}@sha256:${f}"
          done
          echo "Digests to merge: $DIGEST_ARGS"
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Tags to apply: $TAG_ARGS"
          docker buildx imagetools create $TAG_ARGS $DIGEST_ARGS

      - name: Inspect manifest
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting: $TAG"
          docker buildx imagetools inspect "$TAG"

      - name: Generate image report
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
