name: Multi-Arch Docker

on:
  push:
    branches: [main, feat/multi-arch-scratch-image]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger for (re)publishing the image of an already-released tag.
  #
  # Why this exists: GitHub suppresses workflow runs for events triggered by
  # GITHUB_TOKEN (token-recursion protection). Release tags are created by
  # softprops/action-gh-release using GITHUB_TOKEN, so the tag-push event for
  # such tags never fires and this workflow never runs for them. v0.1.12 and
  # v0.1.13 were released without their ghcr.io/strike48-public/pick images
  # ever being published (manifest 404), even though the
  # pick-docker-compose.yml shipped with each release pins them — the easy-mode
  # docker install was broken for both releases. Tags pushed by a human over
  # git/ssh DO fire the push event, which is why e.g. v0.1.11 got its image.
  #
  # Since pick#641 a dispatched release publishes its own image: release.yml
  # calls this workflow (workflow_call, below) before Create Release. The
  # manual dispatch here is the recovery path, for a release whose image is
  # missing anyway and for releases cut before that change. Prerelease tags
  # (v0.1.15-rc.1) are accepted and publish the exact rc tag only.
  #
  # How to (re)publish a release's image: dispatch THIS workflow on main (the
  # default branch) and pass the release tag as the `tag` input:
  #
  #   UI:  Actions -> Multi-Arch Docker -> Run workflow -> tag: v0.1.13
  #   CLI: gh workflow run docker-multiarch.yml --repo
  #        Strike48-public/pick -f tag=v0.1.13
  #
  # The run then checks that tag out explicitly (actions/checkout with
  # ref: ${{ inputs.tag }}) and pushes the image as <version> (0.1.13) plus
  # the tag commit's short sha - and ONLY those tags. Tag-gating invariant
  # (#563): floating tags move ONLY on stable tag-push events; dispatch
  # publishes the exact input version only.
  #
  #   - :X.Y ({{major}}.{{minor}}) - push events with a stable ref_name
  #     only (see the enable gates in the metadata steps below). A dispatch
  #     runs at refs/heads/main, where ref_name is 'main' (no '-'), so the
  #     #562 ref_name guard alone was OPEN on dispatch: an out-of-order
  #     v0.1.12 backfill repointed :0.1 to 0.1.12's digest. The #551
  #     dispatch float line is now locked to enable=false.
  #   - :latest / :main - push events only, so a backfill can never move
  #     them.
  #
  # Operator consequence: release tags created by action-gh-release
  # (GITHUB_TOKEN) fire no push event, so after such a release the float
  # lags at the last git-pushed stable tag until someone re-pushes the tag
  # over git (git push origin :refs/tags/vX.Y.Z && git push origin vX.Y.Z),
  # which fires the push event and moves the float. The backfill itself
  # publishes the exact version + sha, which is what the released compose
  # files pin by default. See docs/DOCKER_INSTALL.md for the
  # operator-facing notes.
  #
  # Why not dispatch AT the tag ref? GitHub validates the workflow_dispatch
  # trigger against the tree of the ref being dispatched. Release tags such
  # as v0.1.13 predate this trigger (added by
  # https://github.com/Strike48-public/pick/pull/551), so their trees have no
  # workflow_dispatch block and dispatching them fails with HTTP 422 "Workflow
  # does not have 'workflow_dispatch' trigger". main has the trigger, so the
  # dispatch happens there and the tag travels as an input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v0.1.13 or v0.1.15-rc.1'
        required: true
        type: string
  # Called by release.yml on a dispatched release (pick#641), so the image
  # exists before Create Release publishes a compose file that pins it. The
  # caller's event is workflow_dispatch, so this runs the backfill path above
  # unchanged: exact version + commit tags, never a float or latest. The tag
  # does not exist yet at that point (Create Release makes it), so the caller
  # also passes `ref`, the commit it built and will tag.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag being published, e.g. v0.1.15'
        required: true
        type: string
      ref:
        description: 'Commit to build: the commit the release will tag'
        required: true
        type: string

concurrency:
  # Backfill dispatches all run at ref refs/heads/main, so the group must
  # include the tag input: without it, backfilling v0.1.12 and v0.1.13 would
  # cancel each other. Re-dispatching the same tag queues instead of racing.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  # Only PR-scoped runs cancel their own stale predecessors (their group is
  # PR-unique, so this only supersedes 'my older run for this PR'). main pushes
  # and workflow_dispatch backfills QUEUE instead of racing: GitHub reruns of
  # workflow_dispatch lose the `inputs` context, dropping a rerun into the bare
  # `${ref}` group where it was repeatedly cancelled by (and cancelled) ordinary
  # main-branch activity — killing the manifest-merge step after both arch
  # builds succeeded (both arch Builds green, Merge cancelled). Queueing
  # defuses that whole collision class; tag/PR/ref keying above is unchanged.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository may contain uppercase — Docker requires lowercase
  REGISTRY_IMAGE: ghcr.io/strike48-public/pick

jobs:
  # ---------------------------------------------------------------------------
  # Build per-architecture images natively (no QEMU)
  # ---------------------------------------------------------------------------
  build-image:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      meta_version: ${{ steps.meta.outputs.version }}
      # Short sha of the commit actually built. On workflow_dispatch this is
      # NOT GITHUB_SHA (which is main's head, the dispatch ref): the vers
      # step below runs after the tag checkout and reports the tag's commit.
      # merge-manifests uses it for the sha tag on the backfill path.
      dispatch_commit: ${{ steps.vers.outputs.commit }}

    steps:
      # workflow_dispatch backfills check out the release tag being
      # (re)published; a release.yml call checks out the commit it passed as
      # `ref` (the tag does not exist yet). On push/PR runs both inputs are
      # empty and actions/checkout falls back to the event's own commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      # docker/metadata-action's type=semver only engages on tag refs
      # (GITHUB_REF=refs/tags/...); a backfill dispatch happens at
      # refs/heads/main, so derive the version tags from inputs.tag here and
      # apply them as type=raw lines (enabled for workflow_dispatch only) in
      # the metadata steps below. Runs after checkout, so HEAD is the tag's
      # commit.
      - name: Derive backfill version from dispatch input
        id: vers
        if: github.event_name == 'workflow_dispatch'
        env:
          # Through env, not ${{ }} in the script, so the input cannot inject shell.
          TAG: ${{ inputs.tag }}
        run: |
          case "${TAG}" in
            v[0-9]*.*) ;;
            *)
              echo "Invalid tag: expected a release tag like v0.1.13" >&2
              exit 1
              ;;
          esac
          # Strict charset guard (review SHOULD-FIX): the case glob admits ',' —
          # v0.1.13,latest passes it, and metadata-action's csv-parse would then
          # let a smuggled field overwrite value= (moving :latest from a backfill).
          # A prerelease suffix (vX.Y.Z-rc.N) is admitted from the same comma-free
          # charset (pick#641): it publishes only the exact rc tag, because the
          # float and latest lines are disabled on this path, never input-gated
          # (#563).
          [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag: comma-free vX.Y.Z[-PRERELEASE] required" >&2; exit 1; }
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          MAJOR_MINOR="${BASE%.*}"
          COMMIT="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "commit=${COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # TAG-GATING INVARIANT (#563): floating tags move ONLY on
            # stable tag-push events; workflow_dispatch backfills publish
            # the exact input version + the tag's sha and nothing else.
            #
            # workflow_dispatch backfill: version tags derived from
            # inputs.tag; never latest, never main, never the float.
            type=raw,value=${{ steps.vers.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # LOCKED (enable=false, #563): this #551 line is the path that
            # repointed :0.1 to 0.1.12's digest when the v0.1.12 backfill
            # ran after v0.1.13's. The float now moves only via the gated
            # semver line below, on a real stable tag push. Do not
            # re-enable.
            type=raw,value=${{ steps.vers.outputs.major_minor }},enable=false
            type=raw,value=${{ steps.vers.outputs.commit }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # push/PR path (unchanged semantics).
            # ref,event=branch is gated to push: metadata-action matches any
            # refs/heads/ ref with no event check, so without the gate a
            # dispatch at main would also tag :main.
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
            # Exact version on tag pushes (stable and prerelease: an rc tag
            # push publishes e.g. 0.1.14-rc.1, nothing floating). Inert on
            # dispatch - GITHUB_REF is refs/heads/main, not a tag ref.
            type=semver,pattern={{version}}
            # Floating major.minor ONLY on real tag-push events carrying a
            # STABLE tag. Both halves of the gate are load-bearing:
            #   github.event_name == 'push' -> a dispatch at main has
            #     ref_name 'main' (no '-') and would sail through the
            #     contains() check below (#563: input-built images
            #     repointed :0.1); on a dispatch GITHUB_REF is not a tag
            #     ref so semver also emits nothing there - the event gate
            #     is the hard closure, the ref check is defense in depth.
            #   !contains(github.ref_name, '-') -> prerelease tags
            #     (vX.Y.Z-rc.N) must never move :X.Y out from under
            #     consumers (compose defaults read {{major}}.{{minor}});
            #     {{version}} still publishes the exact rc tag (#562).
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            # On dispatch GITHUB_SHA is main's head, not the tag's commit;
            # the backfill's sha tag is the raw line above instead.
            type=sha,prefix=,enable=${{ github.event_name != 'workflow_dispatch' }}
            # sha-<short> (pick#630): an additional immutable per-build handle
            # for real pushes (branch + tag). The image's
            # org.opencontainers.image.revision label is stamped from
            # REVISION=github.sha at build time (Dockerfile.scratch), so label
            # == tag sha by construction. Never re-pointed by a later build:
            # each main commit yields its own tag; a workflow re-run of the
            # SAME commit rebuilds the same tag (GHCR has no server-side
            # immutability — the convention is the same one the bare-sha line
            # above has always had). Dispatch backfills keep their own commit
            # raw line; PR runs keep pr-N only.
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            # latest only on push to main. is_default_branch is NOT safe:
            # it is also true for a workflow_dispatch at main, which would
            # move :latest to whatever release is being backfilled.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Build and push per-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY_IMAGE, matrix.arch) || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-arch images into a single multi-arch manifest
  # ---------------------------------------------------------------------------
  merge-manifests:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      # Same derivation as in build-image. This job never checks out source
      # (it only merges per-arch digests), so there is no git here: the short
      # sha of the built commit comes from build-image's dispatch_commit
      # output, where the tag was actually checked out.
      - name: Derive backfill version from dispatch input
        id: vers
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "${TAG}" in
            v[0-9]*.*) ;;
            *)
              echo "Invalid tag: expected a release tag like v0.1.13" >&2
              exit 1
              ;;
          esac
          # Same guard as build-image: comma-free, optional prerelease suffix
          # (pick#641); the float stays disabled on this path (#563).
          [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag: comma-free vX.Y.Z[-PRERELEASE] required" >&2; exit 1; }
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          MAJOR_MINOR="${BASE%.*}"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # Same tag-gating invariant as build-image (#563): floating
            # tags move ONLY on stable tag-push events; workflow_dispatch
            # backfills publish the exact input version + the tag's sha
            # and nothing else.
            #
            # workflow_dispatch backfill: version tags derived from
            # inputs.tag; the sha tag is the tag's own commit (from
            # build-image, which checked it out), never latest, never main,
            # never the float. This job is where tags actually land:
            # build-image pushes the per-arch images by digest and this job
            # applies the tags via imagetools create.
            type=raw,value=${{ steps.vers.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # LOCKED (enable=false, #563): see the matching line in
            # build-image. Do not re-enable.
            type=raw,value=${{ steps.vers.outputs.major_minor }},enable=false
            type=raw,value=${{ needs.build-image.outputs.dispatch_commit }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
            # Exact version on tag pushes (stable and prerelease); inert on
            # dispatch - GITHUB_REF is refs/heads/main, not a tag ref.
            type=semver,pattern={{version}}
            # Floating major.minor ONLY on real tag-push events carrying a
            # STABLE tag - both gate halves load-bearing, see the matching
            # line in build-image (#563, #562).
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=sha,prefix=,enable=${{ github.event_name != 'workflow_dispatch' }}
            # sha-<short> (pick#630): see the matching line in build-image —
            # immutable per-build handle for real pushes, label == tag sha.
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            # latest only on push to main (is_default_branch is also true
            # for a workflow_dispatch at main - see build-image).
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          flavor: |
            latest=false

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}"
          DIGEST_ARGS=""
          for f in *; do
            DIGEST_ARGS="$DIGEST_ARGS ${IMAGE}@sha256:${f}"
          done
          echo "Digests to merge: $DIGEST_ARGS"
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Tags to apply: $TAG_ARGS"
          docker buildx imagetools create $TAG_ARGS $DIGEST_ARGS

      - name: Inspect manifest
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting: $TAG"
          docker buildx imagetools inspect "$TAG"

      - name: Generate image report
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  # pick#445: registry hygiene. PR runs publish ephemeral images tagged
  # `pr-<n>-<sha>`; left alone they bury the release tags in the GHCR tag
  # list. This runs on the same event that publishes a release image (a real
  # STABLE tag push — the same #563 gate the float tags use) and deletes
  # exactly the `pr-*` tags. Everything else is kept: semver tags (incl.
  # prereleases), `latest`, `main`, sha tags, and any unrecognized tag shape
  # (conservative: we never delete what we do not positively recognize as an
  # ephemeral PR tag). Fully-untagged manifests are not listable through the
  # registry tags API and cannot occur here — every publish in this workflow
  # applies at least one tag — so pr-* deletion covers the ephemeral set.
  prune-pr-images:
    name: Prune PR images (GHCR retention)
    runs-on: ubuntu-latest
    needs: [merge-manifests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    steps:
      - name: Delete pr-* tags
        env:
          REGISTRY: ghcr.io
          # Lowercase package, same invariant as REGISTRY_IMAGE above.
          PACKAGE: strike48-public/pick
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${PACKAGE}:pull,delete" | jq -r .token)"
          mapfile -t tags < <(curl -fsS -H "Authorization: Bearer ${token}" \
            "${REGISTRY}/v2/${PACKAGE}/tags/list?n=1000" | jq -r '.tags[] // empty')
          deleted=0; kept=0
          for tag in "${tags[@]}"; do
            # Protection list: semver (with optional prerelease), latest,
            # main, full commit sha.
            if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || [ "$tag" = "latest" ] || [ "$tag" = "main" ] \
              || [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
              kept=$((kept+1))
              continue
            fi
            case "$tag" in
              pr-*)
                # A multi-arch tag may point at several manifest digests;
                # delete every one of them.
                digests="$(curl -fsS -H "Authorization: Bearer ${token}" \
                  "${REGISTRY}/v2/${PACKAGE}/tags/${tag}" | jq -r '.tags[] // empty')"
                for digest in $digests; do
                  code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                    -H "Authorization: Bearer ${token}" \
                    "${REGISTRY}/v2/${PACKAGE}/manifests/${digest}")"
                  if [ "$code" != "202" ] && [ "$code" != "200" ]; then
                    echo "::error::DELETE ${tag}@${digest} -> HTTP ${code}" >&2
                    exit 1
                  fi
                  deleted=$((deleted+1))
                done
                ;;
              *)
                kept=$((kept+1))
                ;;
            esac
          done
          echo "GHCR retention: deleted ${deleted} PR manifest digests, kept ${kept} tags"
