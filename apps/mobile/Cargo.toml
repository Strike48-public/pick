[package]
name = "pick"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
# dx derives the mobile app label from PascalCase of this bin name
# ("pick" -> "Pick"), ignoring [bundle] name. Keep it "pick" so the Android
# launcher / iOS home screen show "Pick". This also names the dx output dir
# (target/dx/pick/...), which the justfile and CI reference.
name = "pick"
path = "src/main.rs"

[dependencies]
# Crates
pentest-core = { workspace = true, features = ["browser-auth"] }
pentest-ui = { workspace = true, features = ["connector", "shell-ws"] }

# Dioxus with mobile feature
dioxus = { workspace = true, features = ["mobile"] }

# Logging
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
pentest-platform = { workspace = true, default-features = false, features = ["android"] }
pentest-tools = { workspace = true, default-features = false, features = ["android"] }
android_logger = "0.14"
log = "0.4"
jni = "0.21"
ndk-context = "0.1"
openssl = { workspace = true }  # Vendored for cross-compilation

[target.'cfg(target_os = "ios")'.dependencies]
pentest-platform = { workspace = true, default-features = false, features = ["ios"] }
pentest-tools = { workspace = true, default-features = false, features = ["ios"] }
# Bridge `tracing` -> Apple unified log (OSLog) so the app's logs are visible on
# iOS via `xcrun simctl spawn booted log stream/show` (Android has
# android_logger; iOS had NO logging init, so all tracing was silently dropped).
tracing-oslog = "0.3"
tracing-subscriber = { workspace = true }

# Fallback for desktop development/testing
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
pentest-platform = { workspace = true, default-features = false, features = ["desktop"] }
pentest-tools = { workspace = true, default-features = false, features = ["desktop"] }
