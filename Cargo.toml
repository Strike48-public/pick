[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/tools",
    "crates/cyberchef",
    "apps/desktop",
    "apps/web",
    "apps/mobile",
    "apps/headless",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor driven by the egui/eframe 0.34 family (rust-version = "1.92").
# This declares the floor so `cargo` errors on older toolchains; it does NOT
# pin a channel. CI intentionally floats on `dtolnay/rust-toolchain@stable`.
rust-version = "1.92"
authors = ["Strike48"]
license = "MIT"
repository = "https://github.com/Strike48-public/pick"

[workspace.dependencies]
# Dioxus 0.7 - platforms via features
dioxus = "0.7"
dioxus-ssr = "0.7"

# OpenSSL vendored for cross-compilation (Android/iOS)
openssl = { version = "0.10", features = ["vendored"] }

# Web server (for liveview - dioxus-liveview 0.7 requires axum 0.8)
axum = { version = "0.8", features = ["ws"] }
dioxus-liveview = { version = "0.7", features = ["axum"] }

# WebSocket
tokio-tungstenite = "0.26"

# Concurrent collections
dashmap = "6"

# HTML entity decoding (server-encoded document titles)
html-escape = "0.2"

# Regex
regex = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# Networking
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls-native-roots", "blocking"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Telemetry (usage analytics + crash/release health). rustls to avoid a native
# OpenSSL dependency on mobile targets.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tempfile = "3.8"
dns-lookup = "2"
base64 = "0.22"
tar = "0.4"
xz2 = "0.1"
open = "5"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Icons
lucide-dioxus = { version = "2", features = ["all-icons"] }

# Platform-specific
sysinfo = "0.32"

# Strike48 Connector SDK
strike48-connector = "0.6.2"
strike48-proto = "0.6.2"

# Internal crates
pentest-core = { path = "crates/core" }
pentest-platform = { path = "crates/platform", default-features = false }
pentest-ui = { path = "crates/ui", default-features = false }
pentest-tools = { path = "crates/tools", default-features = false }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
# Strip symbol tables from release binaries. On Android this takes libmain.so
# from ~40MB to ~26MB (release APK ~16MB -> ~13MB); also shrinks the desktop
# binaries. (panic = "abort" would save a few MB more but is deliberately left
# off: it turns an isolated tokio task panic into a whole-process abort.)
strip = true

# Vendored forks of two dioxus 0.7.9 crates, each carrying local Strike48/pick
# patches (all still needed as of 0.8.0-alpha). Every change is marked in-source
# with `[STRIKE48-PATCH <slug>]` and cataloged in the crate's PATCHES.md:
#   vendor/dioxus-asset-resolver/PATCHES.md  — strip-prefix-panic (Windows asset crash)
#   vendor/dioxus-liveview/PATCHES.md        — webview2-ipc (dioxus.send reverse channel
#                                              dead on WebView2), form-downcast (input crash)
# To audit: `git grep -n STRIKE48-PATCH vendor/`. On upgrade, re-vendor then
# re-apply per each PATCHES.md; drop any patch that has landed upstream.
[patch.crates-io]
dioxus-asset-resolver = { path = "vendor/dioxus-asset-resolver" }
dioxus-liveview = { path = "vendor/dioxus-liveview" }
