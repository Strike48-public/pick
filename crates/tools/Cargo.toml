[package]
name = "pentest-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["pentest-platform/desktop"]
android = ["pentest-platform/android"]
ios = ["pentest-platform/ios"]
# Dev/test only: registers `inject_test_evidence`, which pushes arbitrary
# fabricated findings into the evidence graph. NEVER enable in release builds —
# it is a grounding-guardrail bypass (pick#184). Off by default so production
# connectors never advertise or expose the tool.
inject-test-evidence = []

[dependencies]
# Core
pentest-core = { workspace = true }
pentest-platform = { workspace = true, default-features = false }
pentest-cyberchef = { path = "../cyberchef" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
base64 = { workspace = true }
lazy_static = "1.4"
regex = { workspace = true }
chrono = { workspace = true }
dns-lookup = { workspace = true }
reqwest = { workspace = true }
url = "2.5"
urlencoding = "2.1"
uuid = { workspace = true }
default-net = "0.22" # Network interface detection for safety checks

# Embedded JavaScript engine for the `run_js` tool. QuickJS is a bytecode
# interpreter (no JIT), so it runs inside the iOS app sandbox. See the two
# target-conditional rquickjs deps below — desktop/CI hosts use the FFI
# bindings rquickjs-sys ships prebuilt (no libclang needed, so the common
# build "just works"), while iOS/Android — for which no prebuilt bindings are
# shipped — generate them at build time via bindgen. The nix devShells provide
# the libclang + target sysroot those cross-builds need (see flake.nix).

# Desktop / CI / macOS hosts: rquickjs-sys ships prebuilt bindings.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rquickjs = { version = "0.9", features = ["loader"] }

# iOS / Android cross-targets: no prebuilt bindings — generate via bindgen.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.9", features = ["loader", "bindgen"] }

# aarch64 Windows: rquickjs-sys 0.9 ships prebuilt bindings for
# x86_64-pc-windows-msvc but NOT aarch64-pc-windows-msvc, so the prebuilt path
# fails to `include!` a nonexistent bindings file. Generate via bindgen instead
# (needs libclang, provided by the LLVM/clang install on the arm64 build host).
# Cargo unions features across target tables, so this arm64-Windows entry adds
# `bindgen` on top of the `loader` from the desktop table above.
[target.'cfg(all(target_arch = "aarch64", target_os = "windows"))'.dependencies]
rquickjs = { version = "0.9", features = ["loader", "bindgen"] }

[dev-dependencies]
tempfile = "3"
