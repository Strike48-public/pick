[package]
name = "pick-crux-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# Dev-only: relax TLS verification so the shell can reach the local mkcert dev
# cluster (self-signed / missing-intermediate chain). Enable for sim/emulator
# builds; NEVER enable for a shipping build.
insecure-tls = []

[dependencies]
pick-crux-core = { path = "../crux-core" }
pick-crux-middleware = { path = "../crux-middleware" }
pentest-core = { path = "../core" }
# Tool registry the tool-only connector registers with Strike48. Platform
# features are target-selected below so the correct native tool set is compiled
# for each mobile target (mirrors apps/mobile).
pentest-tools = { workspace = true, default-features = false }
tracing = { workspace = true }
uuid = { workspace = true }
crux_core = "0.19"
bincode = "=1.3.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Route the core's `tracing` events somewhere visible (stderr -> captured by the
# iOS simulator console; Android bridges to logcat via the log adapter below).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Force a statically-linked, vendored OpenSSL so the Android cdylib does not
# dynamically require libssl.so.3 / libcrypto.so.3 (absent on Android). Unifies
# the openssl feature pulled transitively via reqwest/tungstenite native-tls.
openssl = { version = "0.10", features = ["vendored"] }

# Android: bridge `tracing` -> `log` -> logcat so the core's events show in
# `adb logcat`. Compile the Android-native tool set.
[target.'cfg(target_os = "android")'.dependencies]
tracing-log = "0.2"
android_logger = "0.14"
log = "0.4"
pentest-tools = { workspace = true, default-features = false, features = ["android"] }

# iOS: route `tracing` to os_log so events show in Console.app / `log show`
# (stderr from a sim app is not captured by the unified log). Compile the
# iOS-native tool set.
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"
pentest-tools = { workspace = true, default-features = false, features = ["ios"] }

# Desktop hosts (dev/CI, e.g. `cargo test`): compile the desktop tool set so the
# crate builds and tests off-device.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
pentest-tools = { workspace = true, default-features = false, features = ["desktop"] }

[dev-dependencies]
bincode = "=1.3.3"
async-trait = "0.1"
