[package]
name = "pick-crux-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# Dev-only: relax TLS verification so the shell can reach the local mkcert dev
# cluster (self-signed / missing-intermediate chain). Enable for sim/emulator
# builds; NEVER enable for a shipping build.
insecure-tls = []

[dependencies]
pick-crux-core = { path = "../crux-core" }
pick-crux-middleware = { path = "../crux-middleware" }
pentest-core = { path = "../core" }
crux_core = "0.19"
bincode = "=1.3.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Route the core's `tracing` events somewhere visible (stderr -> captured by the
# iOS simulator console; Android bridges to logcat via the log adapter below).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Force a statically-linked, vendored OpenSSL so the Android cdylib does not
# dynamically require libssl.so.3 / libcrypto.so.3 (absent on Android). Unifies
# the openssl feature pulled transitively via reqwest/tungstenite native-tls.
openssl = { version = "0.10", features = ["vendored"] }

# Android: bridge `tracing` -> `log` -> logcat so the core's events show in
# `adb logcat`.
[target.'cfg(target_os = "android")'.dependencies]
tracing-log = "0.2"
android_logger = "0.14"
log = "0.4"

# iOS: route `tracing` to os_log so events show in Console.app / `log show`
# (stderr from a sim app is not captured by the unified log).
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[dev-dependencies]
bincode = "=1.3.3"
async-trait = "0.1"
