[package]
name = "pentest-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["sysinfo", "local-ip-address", "dns-lookup", "network-interface", "dep:lazy_static", "dep:uuid", "dep:image", "desktop-mdns", "wifi_scan", "ssdp-client", "dep:reqwest", "dep:portable-pty", "dep:libc", "dep:sha2", "dep:keyring"]
desktop-all = ["desktop", "desktop-screenshots"]
desktop-screenshots = ["desktop", "screenshots"]
desktop-mdns = ["desktop", "mdns-sd"]
desktop-pcap = ["desktop", "pcap"]
android = ["dep:jni", "dep:ndk-context", "dep:reqwest", "dep:portable-pty", "dep:libc", "dep:tar", "dep:xz2", "dep:sha2"]
# getifaddrs(3) + sysctl(3) are permitted in the iOS app sandbox with no
# entitlement, so native interface/device-info enumeration only needs libc.
ios = ["dep:libc"]

[dependencies]
# Core
pentest-core = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
base64 = { workspace = true }
lazy_static = { version = "1.4", optional = true }
uuid = { workspace = true, optional = true }
image = { version = "0.25", optional = true }

# Desktop-specific
sysinfo = { workspace = true, optional = true }
screenshots = { version = "0.8", optional = true, default-features = false }
local-ip-address = { version = "0.6", optional = true }
dns-lookup = { workspace = true, optional = true }
mdns-sd = { version = "0.11", optional = true }
network-interface = { version = "2", optional = true }
wifi_scan = { version = "0.7", optional = true }
ssdp-client = { version = "2.1", optional = true }

# Sandbox dependencies (desktop)
reqwest = { version = "0.12", features = ["rustls-tls", "rustls-tls-native-roots", "stream"], default-features = false, optional = true }

# OS credential store for the desktop chat-token secure backend. The default
# `v1` feature selects the native store per platform: Windows Credential
# Manager, macOS Keychain, and the Linux Secret Service (each internally
# cfg(target_os)-gated), so a single cross-platform desktop build works.
keyring = { version = "4", optional = true }

# PTY support (desktop + android)
portable-pty = { version = "0.9", optional = true }

# Archive extraction (Android + desktop WSL)
tar = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }

# Android-specific
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
xz2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# pcap — available on Linux and macOS where libpcap is readily available.
# Excluded from Windows builds to avoid requiring the Npcap SDK at compile time.
[target.'cfg(not(target_os = "windows"))'.dependencies]
pcap = { version = "2", optional = true }

# iOS: open URLs via UIApplication (objc2 is already in the tree via
# dioxus-mobile). Used to register a browser opener for the Matrix OAuth flow,
# since `open::that()` has no backend inside the iOS app sandbox.
# iOS native bits. Pin to the same objc2 0.6 major that dioxus 0.7's wry/tao
# stack already uses (objc2-ui-kit 0.3, objc2-foundation 0.3) so there's a
# single objc2 in the iOS FFI path — mixing 0.5 and 0.6 in one call chain
# breaks. AuthenticationServices provides ASWebAuthenticationSession, the
# proper iOS OIDC flow (in-app browser + custom-scheme callback, no localhost).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSDictionary", "NSData"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIResponder", "UIWindow", "UIScene", "UIWindowScene"] }
objc2-authentication-services = { version = "0.3", features = [
    "ASWebAuthenticationSession",
    "ASWebAuthenticationSessionCallback",
    "ASFoundation",
] }
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
